<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>just breathe.</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a14; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 9; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// just breathe.
// A sunset dogfight over the Adriatic, in the manner of a hand-painted anime sky: a white, green and red
// flying boat, a navy float-biplane diving out of the light, violet cumulus with gold edges, a sea full of sun.
// Every pixel is computed: one raymarching fragment shader (WebGL2) draws the planes, clouds and sea;
// the waltz, the engines and the guns are synthesized with Web Audio. Nothing is loaded.
//
// Contract (skills/javascript-animation/scripts/render.mjs): window.draw(frame), FRAMES, FPS, CUES, SCORE.
// draw(frame) is a pure function of the frame: flight paths are integrated once at load, deterministically.

// ───────────────────────── look & sound brief ─────────────────────────
// style    cel-shaded 3D: hard sun terminator, lavender shadows, ink silhouette line; painted sky
// palette  sunset gold (lead) · coral · lavender · deep violet · sea indigo; plane white / green / red
// framing  16:9, horizon on the lower third in wide shots; camera moves like a hand-planned anime layout:
//          long calm push-ins, side tracking, a chase camera that rolls with the plane through the loop
// pace     2-bar shots in the fight, a 4-bar opening and a 4-bar ending; one silent bar before the end
// sound    waltz in D minor, 96 bpm, 3/4: musette accordion, piano, strings, brushes; ends in D major.
//          Engines and guns come from the same world: gain, pan and Doppler follow the camera.

const W = 1280, H = 720, FPS = 30;
const BPM = 96, BEAT = 60 / BPM, BAR = 3 * BEAT;                    // 1.875 s per bar
const SHOTS = [                                                    // [name, bars]
  ['calm',      4],   // wide, low over the sea, looking into the sun; the flying boat roars overhead
  ['profile',   2],   // side tracking: the white-green-red livery against a violet sky
  ['sun-dive',  2],   // over the tail, looking back: the navy biplane drops out of the clouds
  ['tracers',   2],   // wide tracking: tracers, the hero breaks hard
  ['cloud',     2],   // chase through a cumulus wall
  ['loop',      2],   // chase camera rolls with the plane: the whole sky turns over
  ['reversal',  2],   // over the shoulder: now the hero is behind; hits, smoke
  ['ditch',     2],   // from the water: the biplane glides down and lands in a spray
  ['breath',    1],   // silence: skimming the water
  ['breathe',   4],   // toward the sun; "just breathe."
];
let acc = 0;
const SHOT_T = SHOTS.map(([name, bars]) => { const s = { name, t0: acc, t1: acc + bars * BAR }; acc += bars * BAR; return s; });
const DUR = acc, FRAMES = Math.round(DUR * FPS);
const CUES = SHOT_T.slice(1).map(s => +s.t0.toFixed(4));
const TEXT_T = SHOT_T[9].t0 + BAR;                                 // "just breathe." on the second bar of the ending

// gunfire and other hits (seconds); the picture and the soundtrack both read this
const EVENTS = {
  enemyBursts: [[13.95, 14.45], [15.55, 16.2], [17.15, 17.55]],
  heroBursts: [[27.35, 27.8], [28.05, 28.45]],
  hit: 28.35,
  splash: 0,            // set once the enemy path is known (where it touches the water)
  flyby: 5.25,
};

// ───────────────────────── small math ─────────────────────────
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  rot: (v, k, a) => { // Rodrigues: rotate v around unit axis k by angle a
    const c = Math.cos(a), s = Math.sin(a), kv = V.cross(k, v), d = V.dot(k, v) * (1 - c);
    return [v[0] * c + kv[0] * s + k[0] * d, v[1] * c + kv[1] * s + k[1] * d, v[2] * c + kv[2] * s + k[2] * d];
  },
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const mix = (a, b, t) => a + (b - a) * t;
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUN = V.norm([0.12, 0.075, -1]);                             // low sun, just west of south-ahead
const G = 9.8;

// ───────────────────────── flight paths ─────────────────────────
// A "turtle" program: [t, speed m/s, yaw deg/s (left +), pitch deg/s (up +)]; rates blend over 0.4 s.
// Integrated once at load at 240 Hz; orientation is derived from the path itself (lift = accel + g).
function flyProgram(start, fwd0, prog, t0, t1) {
  const dt = 1 / 240, n = Math.ceil((t1 - t0) / dt) + 1, P = new Float64Array(n * 3);
  let p = start.slice(), f = V.norm(fwd0), r = V.norm(V.cross(f, [0, 1, 0]));
  const rate = (t, k) => { // value of column k at time t, blended from the previous segment
    let i = 0; while (i + 1 < prog.length && prog[i + 1][0] <= t) i++;
    const cur = prog[i][k], prev = i > 0 ? prog[i - 1][k] : cur, u = smooth(0, .4, t - prog[i][0]);
    return mix(prev, cur, u);
  };
  for (let i = 0; i < n; i++) {
    const t = t0 + i * dt;
    P[i * 3] = p[0]; P[i * 3 + 1] = p[1]; P[i * 3 + 2] = p[2];
    const yaw = rate(t, 2) * Math.PI / 180 * dt, pitch = rate(t, 3) * Math.PI / 180 * dt;
    f = V.rot(f, [0, 1, 0], yaw); r = V.rot(r, [0, 1, 0], yaw);
    f = V.norm(V.rot(f, r, pitch));
    if (Math.abs(pitch) < 1e-6) f = V.norm([f[0], f[1] * (1 - dt * 1.5), f[2]]);   // no pitch commanded: settle level
    p = V.add(p, V.mul(f, rate(t, 1) * dt));
  }
  const at = t => { const x = clamp((t - t0) / dt, 0, n - 1.001), i = Math.floor(x), u = x - i;
    return [0, 1, 2].map(k => P[i * 3 + k] * (1 - u) + P[i * 3 + 3 + k] * u); };
  return at;
}

// a smooth curve through timed keys (Hermite, tangents from the neighbours)
function keyed(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    const n = keys.length; if (t >= keys[n - 1][0]) return keys[n - 1][1];
    let i = 0; while (keys[i + 1][0] < t) i++;
    const [t0, y0] = keys[i], [t1, y1] = keys[i + 1], h = t1 - t0, u = (t - t0) / h;
    const tan = j => j <= 0 || j >= n - 1 ? 0 : (keys[j + 1][1] - keys[j - 1][1]) / (keys[j + 1][0] - keys[j - 1][0]);
    const m0 = tan(i) * h, m1 = tan(i + 1) * h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * m1;
  };
}

// the hero: a flying boat, white with green and red. The turtle steers (turns, the loop);
// the altitude is its own keyed curve, added on top.
const HERO_PROG = [
  [0,    67, 0, 0],
  [8.6,  64, 34, 0],      // long left turn
  [11.2, 64, 0, 0],
  [15.2, 68, 78, 0],      // hard break
  [16.5, 70, 0, 0],
  [22.75, 56, 0, 104],    // the loop
  [26.2, 80, 0, 0],       // out of the loop, closing fast
];
const HERO_ALT = keyed([[0, 75], [5, 26], [6.5, 27], [9, 55], [11.25, 110], [15, 140], [16.6, 142], [18.6, 112], [21, 88], [22.75, 84],
  [26.2, 84], [28.8, 82], [30.4, 62]]);
const heroStart = [30, 0, 330], heroFwd = [-0.078, 0, -0.986];
const heroTurtle = flyProgram(heroStart, heroFwd, HERO_PROG, 0, DUR + 2);
const heroA = t => { const p = t >= 0 ? heroTurtle(t) : V.add(heroStart, V.mul(V.norm(heroFwd), 67 * t)); return [p[0], p[1] + HERO_ALT(t), p[2]]; };

// the rival: a navy float-biplane. It dives out of the sky, rides the hero's tail (the hero's own path,
// 1.3 s behind), overshoots when the hero loops, is hit, glides down and lands on the water.
const LAG = 1.3, JOIN = 13.5, SPLIT = 22.75 + LAG;
function diveOffset(t) { const s = Math.max(0, JOIN - t); return [18 * s, 31 * s * s, -10 * s]; }
let enemyAfter = null, landT = 0;
function enemyRaw(t) {
  if (t < SPLIT) return V.add(V.add(heroA(t - LAG), [2, 3.5, 0]), diveOffset(t));
  return enemyAfter(t);
}
{
  // after the split the biplane flies its own program, continuing its state at SPLIT
  const p0 = enemyRaw(SPLIT - 1e-3), p1 = enemyRaw(SPLIT - 1 / 60);
  const f0 = V.norm([p0[0] - p1[0], 0, p0[2] - p1[2]]);
  const prog = [
    [SPLIT, 64, 0, 0],
    [27.2, 64, 14, 0],               // a lazy evasive turn
    [EVENTS.hit + .5, 56, 8, 0],     // hit
    [30.4, 50, 4, 0],
    [32.0, 44, 2, 0],
  ];
  const WL = 1.9;                    // the float bottoms sit 1.8 m below the fuselage axis
  const alt = keyed([[SPLIT, p0[1]], [EVENTS.hit, p0[1] - 2], [29.6, p0[1] - 14], [31.2, 30], [32.4, WL + 1.2], [33.5, WL - 2]]);
  const raw0 = flyProgram([p0[0], 0, p0[2]], f0, prog, SPLIT, DUR + 2);
  const raw = t => { const p = raw0(t); return [p[0], alt(t), p[2]]; };
  for (let t = SPLIT; t < DUR; t += 1 / 240) if (raw(t)[1] < WL + .3) { landT = t; break; }
  if (!landT) landT = DUR;
  EVENTS.splash = landT;
  // after touchdown it slides and slows: remap time so its speed decays to zero over ~3 s
  const slide = t => { const u = t - landT; return u <= 0 ? t : landT + 2.6 * (1 - Math.exp(-u / 2.6)); };
  enemyAfter = t => { const p = raw(slide(t)); const sm = Math.log(1 + Math.exp((p[1] - WL) / 1.2)) * 1.2 + WL; return [p[0], sm, p[2]]; };
}
const enemyAt = enemyRaw;

// after the hit the hero rides the smoking biplane down (its path, 0.8 s behind and a little higher),
// passes low over the splash, then flies a fresh program: a long turn toward the sun and a slow climb.
const FOLLOW = 28.6, FREE = 33.6;
const heroB = t => V.lerp(heroA(t), V.add(enemyAt(t - .8), [0, 6, 0]), smooth(FOLLOW, 30.6, t));
let heroC;
{
  const p0 = heroB(FREE), p1 = heroB(FREE - 1 / 60), f0 = V.norm([p0[0] - p1[0], 0, p0[2] - p1[2]]);
  const turtle = flyProgram([p0[0], 0, p0[2]], f0, [[FREE, 50, 0, 0], [35.5, 46, 24.2, 0], [40.3, 46, 0, 0]], FREE, DUR + 2);
  const alt = keyed([[FREE, p0[1]], [34.6, 9], [35.6, 9], [37.5, 16], [40.3, 22], [DUR + 1, 40]]);
  heroC = t => { const p = turtle(t); return [p[0], alt(t), p[2]]; };
}
const heroAt = t => t < FOLLOW ? heroA(t) : t < FREE ? heroB(t) : heroC(t);

// orientation from the path: forward = velocity, up = lift = accel + g (so turns bank and loops invert)
function frameOf(at, t, extraRoll = 0) {
  const h = 1 / 30, p = at(t), pa = at(t - h), pb = at(t + h);
  const vel = V.mul(V.sub(pb, pa), 1 / (2 * h)), f = V.norm(vel);
  let acc3 = [0, 0, 0]; // smoothed acceleration over +-0.15 s
  for (const o of [-.15, -.075, 0, .075, .15]) {
    const q0 = at(t + o - h), q1 = at(t + o), q2 = at(t + o + h);
    acc3 = V.add(acc3, V.mul(V.add(V.sub(q2, V.mul(q1, 2)), q0), 1 / (h * h * 5)));
  }
  const lift = V.add(acc3, [0, G, 0]);
  let up = V.sub(lift, V.mul(f, V.dot(lift, f)));
  if (V.len(up) < 1e-3) up = [0, 1, 0];
  up = V.norm(up);
  let right = V.norm(V.cross(f, up));
  if (extraRoll) { right = V.rot(right, f, extraRoll); up = V.rot(up, f, extraRoll); }
  up = V.cross(right, f);
  return { p, f, up, right, vel, speed: V.len(vel) };
}

// ───────────────────────── clouds (placed around the choreography) ─────────────────────────
// A cluster = a pile of spheres with a flat base, displaced by billow noise in the shader.
const CLOUDS = [];
function cumulus(seed, cx, base, cz, width, height, opts = {}) {
  // a tower of core spheres, then cauliflower lumps set on their upper and outer surfaces
  const R = rng(seed), spheres = [], core = Math.min(opts.core || 4, 5), lumps = Math.min(opts.lumps || 12, 16 - core), r0 = width * .32;
  // two big base lumps side by side, then the tower rising off-centre
  for (let i = 0; i < core; i++) {
    const u = core > 1 ? i / (core - 1) : 0, r = r0 * mix(1, .62, u) * (.92 + .16 * R());
    const spread = i < 2 ? (i ? 1 : -1) * width * .22 : (R() - .5) * width * .22;
    spheres.push([cx + spread + (opts.lean || 0) * u * height,
      base + r * .6 + u * Math.max(0, height - r * 1.2) * .92, cz + (R() - .5) * width * .2, r]);
  }
  for (let i = 0; i < lumps; i++) {
    const c = spheres[Math.min(core - 1, Math.floor(Math.pow(R(), .6) * core))];
    const th = R() * Math.PI * 2, y = mix(.05, 1, Math.pow(R(), .7)), h = Math.sqrt(1 - y * y);
    const dir = [Math.cos(th) * h, y, Math.sin(th) * h * .6], r = c[3] * mix(.26, .44, R());
    spheres.push([c[0] + dir[0] * c[3] * .86, c[1] + dir[1] * c[3] * .86, c[2] + dir[2] * c[3] * .86, r]);
  }
  let ext = 0; const ctr = [cx, base + height * .5, cz];
  for (const s of spheres) ext = Math.max(ext, V.len(V.sub(s, ctr)) + s[3]);
  const lump = r0 * .3;
  CLOUDS.push({ c: ctr, R: ext * 1.1 + lump * .5, base, freq: 1.5 / lump, amp: lump * .38, seed: R() * 100, spheres, skin: Math.max(3, r0 * .035) });
}
{
  // far towers along the sun horizon: backlit, violet with gold edges; the sun sits in the gap between them
  cumulus(11, -3800, 200, -9500, 2600, 3600, { lean: .08 });
  cumulus(12, 5200, 220, -12500, 3000, 2600, {});
  cumulus(13, 9800, 200, -9800, 2400, 3000, { lean: -.06 });
  cumulus(14, -900, 150, -7000, 1100, 700, { core: 3, lumps: 8 });
  cumulus(15, 2800, 150, -7600, 900, 600, { core: 3, lumps: 7 });
  // mid-distance masses around the arena
  cumulus(21, -2700, 260, -1600, 1500, 1700, {});
  cumulus(22, 2600, 280, -2400, 1300, 1200, {});
  cumulus(23, -2000, 240, 1600, 1400, 1800, {});   // front-lit: behind the opening camera
  cumulus(24, 2100, 260, 1900, 1600, 1400, {});
  cumulus(25, -4200, 220, 3600, 2400, 2600, {});
  cumulus(26, 4300, 240, -200, 1800, 2100, {});
  // the cloud the hero dives through (placed on its path)
  const h = heroAt(20.25);
  cumulus(31, h[0] + 6, h[1] - 38, h[2], 70, 70, { core: 3, lumps: 12 });
}

// ───────────────────────── the world at time t ─────────────────────────
const HERO_GUNS = [[.55, .2, 2.6], [-.55, .2, 2.6]];              // local offsets (nose guns under the nacelle)
const ENEMY_GUNS = [[.35, .45, 2.9], [-.35, .45, 2.9]];
const toWorld = (fr, l) => V.add(fr.p, V.add(V.add(V.mul(fr.right, l[0]), V.mul(fr.up, l[1])), V.mul(fr.f, l[2])));

function tracersAt(t, bursts, at, guns, target) {
  const out = [];
  for (const [a, b] of bursts) {
    for (let tf = a; tf <= b && tf <= t; tf += 1 / 11) {
      const age = t - tf; if (age > 1.0) continue;
      const fr = frameOf(at, tf), gi = Math.round(tf * 11) % 2;
      const muzzle = toWorld(fr, guns[gi]);
      // aim leads toward the target a little, so the stream visibly hunts the other plane
      let dir = fr.f;
      if (target) { const tp = target(tf + .35); dir = V.norm(V.lerp(fr.f, V.norm(V.sub(tp, muzzle)), .55)); }
      const v = V.add(fr.vel, V.mul(dir, 420));
      const head = V.add(muzzle, V.mul(v, age)), tail = V.add(muzzle, V.mul(v, Math.max(0, age - .03)));
      out.push({ a: tail, b: head, heat: 1 - age * .6, w: .16 });
    }
  }
  return out;
}

function puffsAt(t) {
  const out = [];
  // smoke from the hit engine: a puff every 0.09 s, drifting and growing, for as long as it flies
  if (t > EVENTS.hit) {
    for (let te = EVENTS.hit; te <= Math.min(t, landT + .3); te += .09) {
      const age = t - te; if (age > 3.4) continue;
      const fr = frameOf(enemyAt, te), src = toWorld(fr, [0, .2, 1.5]);
      const r0 = rng(Math.round(te * 1000));
      const drift = [(r0() - .5) * 3, 2.2 + r0() * 1.5, (r0() - .5) * 3];
      const p = V.add(src, V.mul(drift, age));
      const burst = te < EVENTS.hit + .25 ? 1.7 : 1;
      out.push({ p, r: (1.1 + age * 2.6) * burst, g: te < EVENTS.hit + .2 ? .55 : .16, a: .85 * Math.exp(-age * .8), warm: te < EVENTS.hit + .15 ? 1 : 0 });
    }
  }
  // spray where the floats touch the water, then a sliding wake of foam
  if (t > landT) {
    const R = rng(77);
    for (let i = 0; i < 18; i++) {
      const te = landT + i * .1, age = t - te; if (age < 0 || age > 1.8) continue;
      const fr = frameOf(enemyAt, te), side = i % 2 ? 1.2 : -1.2;
      const base = V.add(toWorld(fr, [side, -1.8, -.5]), [0, 0, 0]);
      const up = 7 * (.6 + R() * .6), out2 = (R() - .5) * 4;
      const p = V.add(base, [fr.right[0] * out2 * age, Math.max(.3, up * age - 4.9 * age * age), fr.right[2] * out2 * age]);
      out.push({ p, r: 1.1 + age * 1.6, g: .95, a: .75 * Math.exp(-age * 2) * smooth(0, .08, age), warm: 0 });
    }
  }
  return out;
}

// ───────────────────────── shots: one camera per shot ─────────────────────────
// each returns { pos, target, up, fov (vertical, degrees) }; t is global, u = 0..1 through the shot
const lookFrame = fr => ({ fwdFlat: V.norm([fr.f[0], 0, fr.f[2]]) });
const CAMS = {
  calm(t, u) {
    const pos = [0, 5.5 + 3 * u, 46 - 6.2 * t];
    return { pos, target: V.add(pos, [0, 118 - 30 * u, -1000]), up: [0, 1, 0], fov: 44 - 2 * u };
  },
  profile(t, u) {
    const fr = frameOf(heroAt, t), ff = lookFrame(fr).fwdFlat, left = V.cross([0, 1, 0], ff);
    const pos = V.add(fr.p, V.add(V.add(V.mul(left, 15 - 2 * u), V.mul(ff, 4.5 - 3 * u)), [0, 1.2, 0]));
    return { pos, target: V.add(fr.p, V.mul(ff, 1.2)), up: [0, 1, 0], fov: 36 };
  },
  'sun-dive'(t, u) {
    const fr = frameOf(heroAt, t), ff = lookFrame(fr).fwdFlat, right = V.cross(ff, [0, 1, 0]);
    const pos = V.add(fr.p, V.add(V.add(V.mul(ff, 6.5), V.mul(right, 2.4)), [0, 3.2, 0]));
    const e = enemyAt(t);
    const target = V.lerp(V.add(fr.p, V.mul(ff, -12)), e, .55 + .1 * u);
    return { pos, target, up: [0, 1, 0], fov: 50 };
  },
  tracers(t, u) {
    const fr = frameOf(heroAt, SHOT_T[3].t0), ff = lookFrame(fr).fwdFlat, right = V.cross(ff, [0, 1, 0]);
    const mid = V.lerp(heroAt(t), enemyAt(t), .4);
    const pos = V.add(mid, V.add(V.add(V.mul(right, -58), V.mul(ff, -6)), [0, -9 + 4 * u, 0]));
    return { pos, target: mid, up: [0, 1, 0], fov: 42 };
  },
  cloud(t, u) {
    const fr = frameOf(heroAt, t), fs = frameOf(heroAt, t - .35);
    const pos = V.add(fs.p, V.add(V.mul(fs.f, -12), V.mul(fs.up, 3.6)));
    return { pos, target: V.add(fr.p, V.mul(fr.f, 10)), up: V.norm(V.lerp([0, 1, 0], fr.up, .5)), fov: 54 };
  },
  loop(t, u) {
    // from outside the loop, three-quarters toward the sun: the hero draws a circle across the sky
    let c = [0, 0, 0]; for (let i = 0; i < 12; i++) c = V.add(c, V.mul(heroAt(22.9 + i * .3), 1 / 12));
    const f0 = frameOf(heroAt, 22.6), ff = V.norm([f0.f[0], 0, f0.f[2]]), right = V.cross(ff, [0, 1, 0]);
    const pos = V.add(c, V.add(V.add(V.mul(right, 78), V.mul(ff, 62 - 16 * u)), [0, -12, 0]));
    const target = V.lerp(c, heroAt(t), .45);
    return { pos, target, up: [0, 1, 0], fov: 52 };
  },
  reversal(t, u) {
    const fr = frameOf(heroAt, t), e = enemyAt(t);
    const pos = toWorld(fr, [2.3, 2.3, -10.5 + 2 * u]);
    const up = V.norm(V.lerp([0, 1, 0], fr.up, .6));
    return { pos, target: V.lerp(toWorld(fr, [0, 1, 20]), e, .5), up, fov: 40 };
  },
  ditch(t, u) {
    // a buoy's-eye view near where the biplane will touch down, looking along its approach
    const L = enemyAt(landT + .5), fl = frameOf(enemyAt, landT);
    const ff = V.norm([fl.f[0], 0, fl.f[2]]), right = V.cross(ff, [0, 1, 0]);
    const pos = V.add(L, V.add(V.add(V.mul(ff, 55), V.mul(right, 34)), [0, 2.2 - L[1], 0]));
    const e = enemyAt(t);
    const target = V.lerp(e, V.add(L, [0, 4, 0]), .35 + .25 * u);
    return { pos, target, up: [0, 1, 0], fov: 40 };
  },
  breath(t, u) {
    const fr = frameOf(heroAt, t), ff = lookFrame(fr).fwdFlat, left = V.cross([0, 1, 0], ff);
    const pos = V.add(fr.p, V.add(V.mul(left, 17), V.mul(ff, 9 - 4 * u)));
    return { pos: [pos[0], fr.p[1] - .8, pos[2]], target: V.add(fr.p, V.mul(ff, -2)), up: [0, 1, 0], fov: 44 };
  },
  breathe(t, u) {
    // the camera waits on the hero's future line into the sun; the hero turns into it and flies away
    const sf = V.norm([SUN[0], 0, SUN[2]]), right = V.cross(sf, [0, 1, 0]), a = heroAt(40.3), k = ease(u);
    const pos = V.add(a, V.add(V.add(V.mul(sf, -48 + 36 * u), V.mul(right, 7)), [0, -a[1] + 5 + 14 * k, 0]));
    const toward = V.add(pos, V.add(V.mul(SUN, 1000), [0, -12, 0]));
    const target = V.add(toward, [0, 25 * (1 - k), 0]);
    return { pos, target, up: [0, 1, 0], fov: 46 - 4 * k };
  },
};

function shotAt(t) { let i = SHOT_T.length - 1; while (i > 0 && SHOT_T[i].t0 > t) i--; return i; }
function cameraAt(t) {
  const i = shotAt(t), s = SHOT_T[i];
  return CAMS[s.name](t, (t - s.t0) / (s.t1 - s.t0));
}

// ───────────────────────── WebGL ─────────────────────────
const VERT = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;

const FRAG = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform vec2 uRes; uniform float uTime; uniform float uFrame;
uniform vec3 uCamPos, uCamR, uCamU, uCamF; uniform float uFocal;
uniform vec3 uSun;
uniform vec3 uHP; uniform mat3 uHR; uniform float uHProp;
uniform vec3 uEP; uniform mat3 uER; uniform float uEProp;
uniform sampler2D uData;
uniform int uNC, uNPuff, uNTr;
uniform int uSteps, uReflSteps;
out vec4 outCol;

#define PI 3.14159265

// ── noise ──
float hash13(vec3 p){ p = fract(p*.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float vnoise2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }
float fbm2(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s += a*vnoise2(p); p = p*2.03 + 17.1; a*=.5; } return s; }

float smin(float a, float b, float k){ float h = clamp(.5+.5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float sdEll(vec3 p, vec3 r){ float k0 = length(p/r), k1 = length(p/(r*r)); return k0*(k0-1.)/max(k1, 1e-6); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }

// ── sky ──
vec3 skyCol(vec3 rd){
  float y = rd.y, sd = dot(rd, uSun);
  float h = max(y, 0.);
  float sunSide = pow(max(dot(normalize(vec3(rd.x, 0., rd.z)), normalize(vec3(uSun.x, 0., uSun.z))), 0.)*.5+.5, 2.);
  vec3 horSun = vec3(1.00, .60, .28), horAway = vec3(.80, .46, .56);
  vec3 hor = mix(horAway, horSun, sunSide);
  vec3 mid = mix(vec3(.42, .32, .60), vec3(.80, .42, .46), sunSide*.55);
  vec3 zen = vec3(.12, .11, .30);
  vec3 c = mix(hor, mid, smoothstep(0., .14, h));
  c = mix(c, zen, smoothstep(.10, .70, h));
  // the low sun: a hot core, a wide glow that warms the whole horizon near it
  float g = max(sd, 0.);
  c += vec3(1.0, .70, .34) * (pow(g, 10.) * .30 + pow(g, 80.) * .50 + pow(g, 900.) * .6);
  c += vec3(1.0, .93, .75) * smoothstep(.99955, .99975, sd) * 1.6;
  // thin painted cirrus, lit pink-gold toward the sun
  if (y > 0.) {
    vec2 uv = rd.xz / (y + .06);
    float n = fbm2(uv * vec2(.55, 2.6) + vec2(uTime*.004, 3.));
    float band = smoothstep(.55, .78, n) * smoothstep(.02, .12, y) * (1. - smoothstep(.35, .7, y));
    vec3 cc = mix(vec3(.93, .62, .70), vec3(1.0, .82, .56), pow(g, 3.));
    c = mix(c, cc, band * .38);
  }
  return c;
}
vec3 hazeCol(vec3 rd){ return skyCol(normalize(vec3(rd.x, .02, rd.z))); }

// ── clouds: piles of spheres, flat bases, billow displacement; rendered as a soft shell ──
vec4 cB(int c){ return texelFetch(uData, ivec2(c, 0), 0); }   // centre, bound radius
vec4 cX(int c){ return texelFetch(uData, ivec2(c, 1), 0); }   // base y, freq, amp, seed
vec4 cS(int c){ return texelFetch(uData, ivec2(c, 2), 0); }   // first sphere, count, skin
float clusterD(int c, vec3 p){
  vec4 x = cX(c), s = cS(c);
  int st = int(s.x), n = int(s.y);
  float d = 1e9;
  for (int i = 0; i < 16; i++) { if (i >= n) break; vec4 sp = texelFetch(uData, ivec2(st+i, 3), 0); d = smin(d, length(p-sp.xyz)-sp.w, sp.w*.45); }
  vec3 q = p * x.y + x.w;
  float b = vnoise(q)*.55 + vnoise(q*2.13+5.2)*.3 + vnoise(q*4.7+9.1)*.15;
  float lift = smoothstep(x.x, x.x + 1./x.y, p.y);           // keep the base flat
  d -= x.z * (b - .38) * lift;
  d = smax(d, x.x - p.y, 1./x.y * .6);
  return d;
}
float cloudMap(vec3 p, out int ci){
  float d = 1e9; ci = -1;
  for (int c = 0; c < 24; c++) {
    if (c >= uNC) break;
    vec4 b = cB(c);
    float db = length(p - b.xyz) - b.w;
    if (db > 0.) { if (db + 1. < d) { d = db + 1.; ci = -1; } continue; }   // outside a bound: only a safe step, no cloud
    float dc = clusterD(c, p);
    if (dc < d) { d = dc; ci = c; }
  }
  return d;
}
vec3 cloudShade(int ci, vec3 p, vec3 rd, float t){
  vec4 x = cX(ci), b = cB(ci);
  float e = cS(ci).z;
  vec2 k = vec2(1, -1);
  vec3 n = normalize(k.xyy*clusterD(ci, p + k.xyy*e) + k.yyx*clusterD(ci, p + k.yyx*e) + k.yxy*clusterD(ci, p + k.yxy*e) + k.xxx*clusterD(ci, p + k.xxx*e));
  float L = .45 / x.y;
  float ao = clamp(clusterD(ci, p + n * L) / L, 0., 1.);
  float h01 = clamp((p.y - x.x) / (b.w * 1.3), 0., 1.);
  float wrap = dot(n, uSun) * .5 + .5;
  vec3 shadow = vec3(.27, .22, .47), midc = vec3(.60, .40, .62), litc = vec3(1.0, .79, .53);
  vec3 c = mix(shadow, midc, smoothstep(.2, .62, wrap) * (.45 + .55 * h01));
  vec3 lit2 = mix(litc * vec3(.86, .74, .78), litc * 1.06, smoothstep(.72, .98, wrap));  // form across the lit side
  c = mix(c, lit2, smoothstep(.56, .70, wrap));                       // a painted terminator
  c += vec3(.09, .07, .15) * max(n.y, 0.);                            // sky on the tops
  c += vec3(.26, .11, .05) * max(-n.y, 0.) * (1. - wrap * .5);        // the sunlit sea under them
  c *= mix(.5, 1., ao);
  float graze = 1. - abs(dot(n, rd));
  c += vec3(1., .70, .38) * pow(max(dot(rd, uSun), 0.), 4.) * pow(graze, 2.) * 1.8;  // gold lining
  float fog = 1. - exp(-t * .00005);
  return mix(c, hazeCol(rd), fog * .7);
}
vec4 traceClouds(vec3 ro, vec3 rd, float tmax, int steps, out float tFirst){
  tFirst = -1.;
  float t0 = 1e9, t1 = 0.;
  for (int c = 0; c < 24; c++) {
    if (c >= uNC) break;
    vec4 b = cB(c); vec3 oc = ro - b.xyz;
    float bb = dot(oc, rd), cc = dot(oc, oc) - b.w*b.w, h = bb*bb - cc;
    if (h < 0.) continue; h = sqrt(h);
    float a = -bb - h, e = -bb + h;
    if (e < 0.) continue;
    t0 = min(t0, max(a, 0.)); t1 = max(t1, e);
  }
  vec4 acc = vec4(0);
  if (t0 > tmax) return acc;
  t1 = min(t1, tmax);
  float t = t0 + hash12(gl_FragCoord.xy + uFrame) * 2.;   // dithered start: no banding
  int shaded = -1; vec3 col = vec3(0);
  float tPrev = t;
  int ci0; bool inside = cloudMap(ro + rd * t, ci0) < 0.;              // the camera starts inside a cloud
  for (int i = 0; i < 200; i++) {
    if (i >= steps || t > t1 || acc.a > .97) break;
    vec3 p = ro + rd * t;
    int ci; float d = cloudMap(p, ci);
    float stp;
    if (inside && d < 0.) {
      // in the cloud with the camera: a bright, thin mist, brighter toward the sun
      stp = max(2., -d * .5);
      float a = 1. - exp(-stp * .012);
      vec3 m = mix(vec3(.72, .58, .78), vec3(1., .84, .70), clamp(dot(rd, uSun) * .5 + .5 + rd.y, 0., 1.));
      acc.rgb += (1. - acc.a) * a * m; acc.a += (1. - acc.a) * a;
    } else if (ci >= 0) {
      inside = false;
      float skin = cS(ci).z;
      if (d < skin) {
        if (ci != shaded) {
          // entering the shell: back up to the surface itself and shade there
          float lo = tPrev, hi = t;
          for (int k = 0; k < 6; k++) { float mid = .5 * (lo + hi); int cj; if (cloudMap(ro + rd * mid, cj) < skin * .5) hi = mid; else lo = mid; }
          col = cloudShade(ci, ro + rd * hi, rd, hi); shaded = ci;
        }
        float dens = clamp((skin - d) / skin, 0., 1.);
        stp = max(skin * .4, .5);
        float a = 1. - exp(-dens * stp / skin * 3.);
        acc.rgb += (1. - acc.a) * a * col; acc.a += (1. - acc.a) * a;
        if (tFirst < 0.) tFirst = t;
      } else { stp = max((d - skin * .5) * .8, max(skin * .9, t * .002)); shaded = -1; }
    } else { stp = max(d, 2.); inside = false; }
    tPrev = t;
    t += stp;
  }
  return acc;
}

// ── planes ──
// hero: a flying boat. materials: 1 hull, 2 wing, 3 float, 4 nacelle, 5 tailplane, 6 fin, 7 cockpit, 8 strut, 9 spinner
vec2 heroMap(vec3 p){
  vec3 q = p;
  float taper = mix(1., .38, smoothstep(.6, -4.4, q.z));
  float hull = sdEll(vec3(q.x/taper, (q.y+.05)/taper, q.z), vec3(.64, .7, 4.35)) * taper;
  hull = smax(hull, -(q.y + .5), .12);                         // flat planing bottom
  vec2 r = vec2(hull, 1.);
  float cock = sdEll(q - vec3(0., .5, .35), vec3(.34, .3, .75));
  if (cock < r.x) r = vec2(cock, 7.);
  float wing = sdEll(q - vec3(0., .58, .25), vec3(5.7, .09, .9));
  if (wing < r.x) r = vec2(wing, 2.);
  vec3 qf = vec3(abs(q.x), q.yz);
  float fl = sdEll(qf - vec3(4.35, -.38, .35), vec3(.17, .16, .78));
  if (fl < r.x) r = vec2(fl, 3.);
  float st = sdCap(qf, vec3(4.35, -.28, .35), vec3(4.2, .55, .3), .035);
  st = min(st, sdCap(qf, vec3(1.25, .6, .45), vec3(.08, 1.25, .75), .04));
  st = min(st, sdCap(q, vec3(0., .55, 1.25), vec3(0., 1.2, 1.15), .07));
  st = min(st, sdCap(q, vec3(0., .55, -.15), vec3(0., 1.2, .0), .07));
  if (st < r.x) r = vec2(st, 8.);
  float nac = sdEll(q - vec3(0., 1.45, .6), vec3(.42, .42, 1.55));
  if (nac < r.x) r = vec2(nac, 4.);
  float sp = sdEll(q - vec3(0., 1.45, 2.18), vec3(.17, .17, .3));
  if (sp < r.x) r = vec2(sp, 9.);
  float hs = sdEll(q - vec3(0., .42, -3.95), vec3(1.85, .05, .5));
  if (hs < r.x) r = vec2(hs, 5.);
  vec3 qfin = q - vec3(0., .95, -4.05); qfin.z += qfin.y * .35;
  float fin = sdEll(qfin, vec3(.05, .85, .55));
  if (fin < r.x) r = vec2(fin, 6.);
  return r;
}
// rival: a float-biplane. materials: 11 fuselage, 12 wings, 13 floats, 14 struts, 15 tail, 16 cockpit, 17 spinner
vec2 enemyMap(vec3 p){
  vec3 q = p;
  float taper = mix(1., .36, smoothstep(.5, -3.7, q.z));
  float fus = sdEll(vec3(q.x/taper, q.y/taper, q.z), vec3(.56, .64, 3.7)) * taper;
  vec2 r = vec2(fus, 11.);
  float cock = sdEll(q - vec3(0., .5, -.4), vec3(.3, .28, .6));
  if (cock < r.x) r = vec2(cock, 16.);
  float w1 = sdEll(q - vec3(0., 1.05, .55), vec3(4.6, .07, .72));
  float w2 = sdEll(q - vec3(0., -.35, .35), vec3(4.2, .07, .66));
  float w = min(w1, w2);
  if (w < r.x) r = vec2(w, 12.);
  vec3 qf = vec3(abs(q.x), q.yz);
  float fl = sdEll(qf - vec3(1.05, -1.75, .55), vec3(.27, .25, 2.4));
  if (fl < r.x) r = vec2(fl, 13.);
  float st = sdCap(qf, vec3(2.9, -.35, .35), vec3(2.9, 1.05, .55), .04);
  st = min(st, sdCap(qf, vec3(1.05, -1.55, 1.2), vec3(.45, -.3, 1.1), .045));
  st = min(st, sdCap(qf, vec3(1.05, -1.55, -.3), vec3(.45, -.3, -.2), .045));
  st = min(st, sdCap(qf, vec3(.4, .4, .9), vec3(.9, 1.05, .6), .035));
  if (st < r.x) r = vec2(st, 14.);
  float hs = sdEll(q - vec3(0., .12, -3.35), vec3(1.5, .05, .45));
  vec3 qfin = q - vec3(0., .7, -3.45); qfin.z += qfin.y * .4;
  hs = min(hs, sdEll(qfin, vec3(.05, .72, .5)));
  if (hs < r.x) r = vec2(hs, 15.);
  float sp = sdEll(q - vec3(0., 0., 3.72), vec3(.2, .2, .32));
  if (sp < r.x) r = vec2(sp, 17.);
  return r;
}
vec2 planeMap(int w, vec3 p){ return w == 0 ? heroMap(p) : enemyMap(p); }
vec3 planeNormal(int w, vec3 p){
  const vec2 k = vec2(1, -1); float e = .004;
  return normalize(k.xyy*planeMap(w, p + k.xyy*e).x + k.yyx*planeMap(w, p + k.yyx*e).x + k.yxy*planeMap(w, p + k.yxy*e).x + k.xxx*planeMap(w, p + k.xxx*e).x);
}

const vec3 C_WHITE = vec3(.95, .93, .88), C_GREEN = vec3(.12, .52, .30), C_RED = vec3(.80, .15, .13);
const vec3 C_NAVY = vec3(.10, .15, .34), C_GOLD = vec3(.93, .74, .30), C_STRUT = vec3(.22, .2, .24);
vec3 paint(float m, vec3 q){
  if (m < 1.5) {                                  // hull: white over red, green pinstripe
    float wl = -.17 + .03*q.z;
    vec3 c = q.y < wl ? C_RED : C_WHITE;
    if (abs(q.y - (wl + .1)) < .045) c = C_GREEN;
    if (q.z > 3.6) c = C_RED;                        // red nose cap
    return c;
  }
  if (m < 2.5) {                                  // wing: white, tricolour bands toward the tips
    float ax = abs(q.x);
    if (ax > 4.75) return C_RED;
    if (ax > 4.05) return C_WHITE;
    if (ax > 3.35) return C_GREEN;
    return C_WHITE;
  }
  if (m < 3.5) return C_GREEN;
  if (m < 4.5) return abs(q.z - 1.2) < .12 ? C_WHITE : C_RED;   // red nacelle, white band
  if (m < 5.5) return abs(q.x) > 1.25 ? C_RED : C_WHITE;
  if (m < 6.5) { float z = q.z + (q.y - .95)*.35; return z > -3.82 ? C_GREEN : (z > -4.22 ? C_WHITE : C_RED); } // rudder tricolour
  if (m < 7.5) return vec3(.10, .09, .14);
  if (m < 8.5) return C_STRUT;
  if (m < 9.5) return C_WHITE;
  // the rival
  if (m < 11.5) return (q.y > .05 && abs(q.y - .18) < .07) ? C_GOLD : C_NAVY;
  if (m < 12.5) return abs(abs(q.x) - 3.6) < .18 ? C_GOLD : C_NAVY;
  if (m < 13.5) return q.y < -1.82 ? vec3(.55, .12, .12) : C_NAVY;
  if (m < 14.5) return C_STRUT;
  if (m < 15.5) return abs(q.z + 3.75) < .12 ? C_GOLD : C_NAVY;
  if (m < 16.5) return vec3(.08, .08, .12);
  return C_GOLD;
}
vec3 shadePlane(vec3 alb, vec3 n, vec3 rd, float m){
  float ndl = dot(n, uSun);
  float lit = smoothstep(-.2, -.12, ndl);                             // hard cel terminator (wrapped a little)
  vec3 shadowC = alb * vec3(.56, .50, .78);                           // lavender shade
  vec3 litC = alb * vec3(1.12, .94, .76);                             // warm sun
  vec3 c = mix(shadowC, litC, lit);
  c += alb * (n.y > 0. ? vec3(.05, .05, .12) * n.y : vec3(.18, .08, .04) * -n.y);  // sky above, sunlit sea below
  float fres = pow(1. - max(dot(n, -rd), 0.), 3.);
  c += fres * vec3(1., .66, .40) * .55 * smoothstep(-.4, .6, dot(rd, uSun));        // rim toward the sun
  float sp = pow(max(dot(reflect(rd, n), uSun), 0.), 60.);
  c += smoothstep(.35, .5, sp) * .45 * vec3(1., .9, .75) * lit;       // a cel glint
  if ((m > 6.5 && m < 7.5) || (m > 15.5 && m < 16.5)) c += pow(max(dot(reflect(rd, n), uSun), 0.), 8.) * vec3(1., .8, .6) * .7;
  return c;
}

// returns colour + alpha, and the hit distance (1e9 if none); includes the ink outline and the prop disc
vec4 tracePlane(int w, vec3 ro, vec3 rd, float tmax, out float tHit){
  tHit = 1e9;
  vec3 P = w == 0 ? uHP : uEP; mat3 R = w == 0 ? uHR : uER;
  vec3 lo = transpose(R) * (ro - P), ld = transpose(R) * rd;
  vec3 bc = vec3(0., .4, .2); float br = 6.4;
  vec3 oc = lo - bc; float b = dot(oc, ld), c = dot(oc, oc) - br*br, h = b*b - c;
  if (h < 0.) return vec4(0);
  h = sqrt(h);
  float t = max(-b - h, 0.), t1 = min(-b + h, tmax);
  if (t > t1) return vec4(0);
  float pix = 2.2 / (uFocal * uRes.y);
  float minR = 1e9, hitT = -1.; vec2 res;
  for (int i = 0; i < 90; i++) {
    vec3 q = lo + ld * t;
    res = planeMap(w, q);
    float eps = max(.0015, t * pix * .35);
    if (res.x < eps) { hitT = t; break; }
    minR = min(minR, res.x / (t * pix));
    t += res.x * .8;
    if (t > t1) break;
  }
  vec4 col = vec4(0);
  if (hitT > 0.) {
    vec3 q = lo + ld * hitT;
    vec3 nl = planeNormal(w, q);
    vec3 n = R * nl;
    col = vec4(shadePlane(paint(res.y, q), n, rd, res.y), 1.);
    // ink on the silhouette's inner edge too: darken where the surface turns away from us
    float edge = 1. - smoothstep(.12, .3, abs(dot(n, rd)));
    col.rgb = mix(col.rgb, vec3(.13, .08, .18), edge * .6);
    tHit = hitT;
  } else if (minR < 1.4) {

  const bass = (t, m, v) => { osc(t, 'sine', hz(m), v, .008, .5, music); osc(t, 'triangle', hz(m) * 2, v * .25, .008, .2, music); };
  const brush = (t, v, pan = 0) => noise(t, .16, 'bandpass', 5200, .7, v, music, .004, pan);
  const timp = (t, m, v) => { osc(t, 'sine', hz(m), v, .006, .55, music); noise(t, .15, 'lowpass', 300, .5, v * .5, music); };

  // harmony per bar (the break bar is silent)
  const CH = { Dm: [50, 53, 57], Bb: [46, 50, 53], Gm: [43, 46, 50], A: [45, 49, 52], F: [41, 45, 48], C: [48, 52, 55], D: [50, 54, 57], G: [43, 47, 50], Em: [52, 55, 59] };
  const CHORDS = ['Dm', 'Bb', 'Gm', 'A',  'Dm', 'A',  'Bb', 'A',  'Gm', 'A',  'Dm', 'A',  'F', 'C',  'Bb', 'A',  'Dm', 'A',  null,  'D', 'G', 'A', 'D'];
  // melody: [bar, beat, midi, beats]
  const MEL = [
    [2, 0, 74, 1], [2, 1, 70, 1], [2, 2, 67, 1], [3, 0, 69, 2], [3, 2, 73, 1],
    [4, 0, 69, 1], [4, 1, 74, 1], [4, 2, 77, 1], [5, 0, 76, 2], [5, 2, 73, 1],
    [6, 0, 77, 1], [6, 1, 74, 1], [6, 2, 70, 1], [7, 0, 73, 1.5], [7, 1.5, 74, .5], [7, 2, 76, 1],
    [8, 0, 79, 2], [8, 2, 77, .5], [8, 2.5, 76, .5], [9, 0, 76, 1], [9, 1, 73, 1], [9, 2, 69, 1],
    [10, 0, 74, .5], [10, .5, 76, .5], [10, 1, 77, 1], [10, 2, 81, 1], [11, 0, 79, 1], [11, 1, 76, 1], [11, 2, 73, 1],
    [12, 0, 81, 2], [12, 2, 77, 1], [13, 0, 79, 1.5], [13, 1.5, 76, .5], [13, 2, 72, 1],
    [14, 0, 74, 1], [14, 1, 77, 1], [14, 2, 82, 1], [15, 0, 81, 2], [15, 2, 76, 1],
    [16, 0, 77, 1], [16, 1, 76, 1], [16, 2, 74, 1], [17, 0, 73, 2], [17, 2, 69, 1],
    [19, 0, 78, 2], [19, 2, 76, 1], [20, 0, 74, 2], [20, 2, 71, 1], [21, 0, 76, 3], [22, 0, 74, 3],
  ];
  const bt = (bar, beat) => bar * BAR + beat * BEAT;
  CHORDS.forEach((name, b) => {
    if (!name) return;
    const ch = CH[name], t0 = b * BAR, intro = b < 4, fight = b >= 4 && b < 18, end = b >= 19;
    if (intro || end) {
      // piano arpeggio in eighths, a soft string pad under it
      const arp = [ch[0] + 12, ch[1] + 12, ch[2] + 12, ch[0] + 24, ch[2] + 12, ch[1] + 12];
      arp.forEach((m, i) => piano(t0 + i * BEAT / 2, m, (i === 0 ? .09 : .065) * (end ? .9 : 1), i % 2 ? .3 : -.3));
      strings(t0, ch[0], BAR + .1, end ? .03 : .022); strings(t0, ch[2], BAR + .1, end ? .022 : .016);
      bass(t0, ch[0] - 12, intro && b < 2 ? .1 : .14);
    }
    if (fight) {
      // oom-pah-pah: bass on one, a staccato accordion chord on two and three
      bass(t0, ch[0] - 12, .2);
      for (const beat of [1, 2]) ch.forEach((m, i) => accordion(t0 + beat * BEAT, m + 12, BEAT * .45, .028, (i - 1) * .25));
      strings(t0, ch[0] + 12, BAR + .1, .028); strings(t0, ch[1] + 12, BAR + .1, .022);
      if (b >= 6) { brush(t0 + BEAT, .05, -.3); brush(t0 + 2 * BEAT, .045, .3); brush(t0 + 2.5 * BEAT, .025, .3); }
      if (b >= 6 && b < 16) timp(t0, ch[0] - 12, .09);
    }
    if (b === 22) { // the last chord rings out
      [62, 66, 69, 74].forEach((m, i) => piano(t0 + BAR + i * .09, m + 12, .07, (i - 1.5) * .3));
      strings(t0 + BAR, 50, DUR - t0 - BAR, .03); strings(t0 + BAR, 57, DUR - t0 - BAR, .02);
      bass(t0 + BAR, 38, .12);
    }
  });
  for (const [b, beat, m, len] of MEL) {
    const t = bt(b, beat);
    if (b >= 19 || b < 4) piano(t, m, b >= 19 ? .11 : .08, .1);
    else accordion(t, m, len * BEAT * .96, .05);
  }

  // ── sound effects from the world: engines follow the camera (gain, pan, Doppler) ──
  const engine = (at, base, gainK, brightness, pan0) => {
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner();
    const trem = ac.createOscillator(), tg = ac.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = brightness; lp.Q.value = 1.5;
    const am = ac.createGain(); am.gain.value = .72;                       // propeller throb: its own stage, so silence stays silent
    trem.frequency.value = base * .25; tg.gain.value = .28; trem.connect(tg); tg.connect(am.gain);
    const ng = ac.createGain(), nf = ac.createBiquadFilter(), ns = ac.createBufferSource();
    ns.buffer = noiseBuf; ns.loop = true; nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = .6; ng.gain.value = .5;
    ns.connect(nf); nf.connect(ng); ng.connect(lp);
    o1.connect(lp); o2.connect(lp); lp.connect(am); am.connect(g); g.connect(p); p.connect(sfx);
    g.gain.setValueAtTime(0, T0);
    const step = 1 / 30;
    for (let t = 0; t <= DUR; t += step) {
      const cam = cameraAt(t), pos = at(t), pos2 = at(t + step);
      const d = V.sub(pos, cam.pos), dist = Math.max(3, V.len(d));
      const camNext = cameraAt(t + step), dist2 = Math.max(3, V.len(V.sub(pos2, camNext.pos)));
      const radial = (dist2 - dist) / step;                               // m/s away from the camera
      const dop = clamp(340 / (340 + radial), .7, 1.4);
      const f = V.norm(V.sub(cam.target, cam.pos)), r = V.norm(V.cross(f, cam.up));
      const pan = clamp(V.dot(V.norm(d), r) * .8, -.9, .9);
      const silent = t >= SHOT_T[8].t0 && t < SHOT_T[9].t0;              // the breath: engines drop out
      const gtarget = silent ? 0 : clamp(gainK * 30 / (dist + 20), 0, gainK);
      const s = T0 + t;
      g.gain.linearRampToValueAtTime(gtarget * .65, s);
      o1.frequency.linearRampToValueAtTime(base * dop, s); o2.frequency.linearRampToValueAtTime(base * .5 * dop, s);
      trem.frequency.linearRampToValueAtTime(base * .25 * dop, s);
      p.pan.linearRampToValueAtTime(pan, s);
    }
    for (const n of [o1, o2, trem, ns]) { n.start(T0); n.stop(T0 + DUR + .1); }
  };
  engine(heroAt, 88, .09, 900);
  engine(t => enemyAt(t), 73, .075, 700);
  // guns: a burst of noise cracks at 11 Hz, placed like the engines
  const gunAt = (bursts, at, level) => {
    for (const [a, b] of bursts) for (let tf = a; tf <= b; tf += 1 / 11) {
      const cam = cameraAt(tf), d = V.len(V.sub(at(tf), cam.pos));
      const f = V.norm(V.sub(cam.target, cam.pos)), r = V.norm(V.cross(f, cam.up)), pan = clamp(V.dot(V.norm(V.sub(at(tf), cam.pos)), r), -.9, .9);
      const v = level * clamp(40 / (d + 20), .2, 1);
      noise(tf, .06, 'bandpass', 1800, .9, v, sfx, .001, pan);
      osc(tf, 'square', 95, v * .5, .001, .025, sfx, pan);
    }
  };
  gunAt(EVENTS.enemyBursts, enemyAt, .11);
  gunAt(EVENTS.heroBursts, heroAt, .12);
  // the hit: a dull clank and a cough of the engine
  osc(EVENTS.hit, 'triangle', 180, .12, .002, .12, sfx); noise(EVENTS.hit, .4, 'lowpass', 900, .7, .16, sfx); osc(EVENTS.hit + .05, 'square', 60, .06, .002, .15, sfx);
  for (let i = 0; i < 6; i++) noise(EVENTS.hit + .35 + i * .27, .12, 'lowpass', 500, .9, .05, sfx);
  // the flyby over the opening camera: a rising rush of air
  noise(EVENTS.flyby - 1.2, 2.4, 'bandpass', 700, .5, .05, sfx, 1.1);
  // the splash
  noise(EVENTS.splash, 1.6, 'lowpass', 1600, .5, .18, sfx, .02); noise(EVENTS.splash + .05, 1.2, 'highpass', 3000, .5, .06, sfx, .03);
  // the breath: only wind and the sea
  noise(SHOT_T[8].t0, BAR + .4, 'bandpass', 420, .4, .035, sfx, .3);
}
window.SCORE = ac => buildScore(ac);

// ───────────────────────── live preview ─────────────────────────
if (!q.has('render')) {
  let start = performance.now(), audio = null;
  const loop = () => {
    const f = Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES;
    draw(f);
    requestAnimationFrame(loop);
  };
  canvas.addEventListener('click', () => {
    if (audio) { audio.close(); audio = null; return; }
    audio = new AudioContext(); start = performance.now(); buildScore(audio);
  });
  loop();
}
</script>
</body>
