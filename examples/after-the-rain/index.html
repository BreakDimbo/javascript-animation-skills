<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>雨停之后 · After the Rain</title>
<style>
  html,body{margin:0;background:#0d0e10;display:grid;place-items:center;height:100vh;overflow:hidden}
  canvas{width:min(100vw,177.78vh);height:auto;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 雨停之后 / After the Rain — a 90-second hand-painted film drawn entirely in code.
// Every pixel is computed; nothing is loaded. draw(frame) is a pure function of the frame number:
// static "background plates" are painted once from seeded noise and cached, everything else is
// computed from t. The soundtrack (piano, strings, celesta, rain, the myna) is synthesized below.
const W = 1920, H = 1080, FPS = 24, DUR = 90, FRAMES = FPS * DUR;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
let ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

// ---------- LOOK ----------
// Style: hand-painted anime. Backgrounds are still paintings (gouache texture, soft bloom, lobed cumulus,
//   pastel shophouses); the one character, the myna, is a cel-shaded anime lead that moves on twos.
// Palette: from the photos, pushed brighter. Rain half = slate, teal, olive river, moss green, warm windows;
//   sun half = cerulean sky, cream cumulus, sap-green leaves. Leads: the café's pink shutters,
//   the orange life ring, the maroon umbrella and the myna's yellow beak (the one colour that follows us).
// Type: a CJK serif (Noto Serif / Songti), used only for the title and the end card.
// Framing: 16:9, 24 fps. Pace: story, 1.5-9 s shots; slow at the start, quick in the heist, long at the end.
const LOOK = {
  font: '{w} {s}px "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", serif',
  line: '#3b2a22',                 // cel outline colour: warm dark brown, never black
};
const C = {
  // rain
  rainSkyTop: '#6f7c86', rainSkyLow: '#b7c0c2', mist: '#c9cfcd', slate: '#4d5963',
  // sun
  skyTop: '#2f78c4', skyMid: '#6aa8dc', skyLow: '#cfe5ee', cloud: '#fffaf0', cloudShade: '#aab8d2', cloudMid: '#e7e9ef',
  // greens
  leafDeep: '#1f3a2c', leafDark: '#2d5238', leafMid: '#4c7a45', leafLight: '#86ad55', leafHi: '#c6dc7a',
  // city
  charcoal: '#393d45', charcoalLite: '#4c525c', pink: '#ef9ea3', pinkShade: '#c97a80', orange: '#f19a38',
  cream: '#e9e0cc', tower: '#8b9aa6', towerShade: '#6d7c89',
  pave: '#3b4148', paveWet: '#2d3238', redLine: '#d9473a', brick: '#9c5c47',
  river: '#8c8266', riverSun: '#b9a77b',
  umbBlack: '#26272b', maroon: '#6c2330', maroonLite: '#8b3341', umbCream: '#efe8db',
  // interior
  brass: '#7f5f2f', brassLite: '#d7a655', walnut: '#a2582a', walnutLite: '#c8743a', concrete: '#9b9a93', black: '#1c1c1f',
  // the myna
  bird: '#2a2b31', birdShade: '#17171b', birdSheen: '#4a5264', beak: '#f2b41c', beakShade: '#c98a10', eye: '#efe7c8',
  // food
  salmon: '#e8703f', salmonLite: '#f59a6a', avo: '#a2bf4c', avoLite: '#d7e39a', burrata: '#f7f4ec', lemon: '#f6c83f',
  prawn: '#f39767', prawnLite: '#fdc9a2', crema: '#b7743f', cremaDark: '#6f3a1c', milk: '#fbf6ec',
  wood: '#7e7466', woodLite: '#9c917f', plate: '#f4f2ee', plateShade: '#d8d6d2',
};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeIO = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const bump = (t, a, b) => Math.sin(prog(t, a, b) * Math.PI);         // 0 -> 1 -> 0 between a and b
function hash2(a, b) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => vnoise(x, y) * .55 + vnoise(x * 2.1 + 5, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3 + 9) * .15;
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- colour ----------
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const hex = c => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return hex(A.map((v, i) => lerp(v, B[i], clamp(t)))); };
const rgba = (h, a) => { const [r, g, b] = rgbOf(h); return `rgba(${r},${g},${b},${a})`; };
const shade = (h, k) => hex(rgbOf(h).map(v => k < 1 ? v * k : v + (255 - v) * (k - 1)));

// ---------- canvases & cached plates ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const PLATES = {};
// A plate is painted once (seeded, so identical every time) and reused: the painted background of a cel.
function plate(key, w, h, paint) {
  if (!PLATES[key]) { const c = mk(w, h), m = ctx; ctx = c.getContext('2d'); paint(w, h); ctx = m; PLATES[key] = c; }
  return PLATES[key];
}
function onLayer(c, fn) { const m = ctx; ctx = c.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); fn(); ctx = m; return c; }
const SCR = [mk(W, H), mk(W, H), mk(W, H), mk(W, H)];                // per-frame scratch layers (blur, dissolves)

// ---------- path primitives ----------
function smooth(pts, closed = true) {                                  // quadratic-midpoint smooth path
  ctx.beginPath();
  if (pts.length < 3) { ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); if (closed) ctx.closePath(); return; }
  const P = closed ? [...pts, pts[0], pts[1]] : pts;
  ctx.moveTo(...(closed ? [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2] : P[0]));
  for (let i = 1; i < P.length - 1; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  if (!closed) ctx.lineTo(...P[P.length - 1]); else ctx.closePath();
}
function poly(pts) { ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); }
function fillS(pts, col, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; smooth(pts); ctx.fill(); ctx.restore(); }
function fillP(pts, col, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; poly(pts); ctx.fill(); ctx.restore(); }
function ell(x, y, rx, ry, col, rot = 0, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); ctx.fill(); ctx.restore(); }
function strokeS(pts, col, w, closed = false, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = ctx.lineJoin = 'round'; smooth(pts, closed); ctx.stroke(); ctx.restore(); }
function seg(x0, y0, x1, y1, col, w, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore(); }
function rectF(x, y, w, h, col, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); ctx.restore(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rad(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function glow(x, y, r, col, a, op = 'source-over') { ctx.save(); ctx.globalCompositeOperation = op; ctx.fillStyle = rad(x, y, 0, r, [[0, rgba(col, a)], [1, rgba(col, 0)]]); ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
const ellPts = (cx, cy, rx, ry, rot = 0, n = 28) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
const wob = (pts, seed, amp, f = .02) => pts.map(([x, y]) => [x + (vnoise(x * f + seed, y * f) - .5) * 2 * amp, y + (vnoise(x * f, y * f + seed + 40) - .5) * 2 * amp]);

// cel-shaded shape: base fill, one shadow tone on the side away from the light, thin warm outline
function cel(pts, base, sh, o = {}) {
  const { lx = -1, ly = -1, k = .12, line = LOOK.line, lw = 2, a = 1 } = o;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = sh; smooth(pts); ctx.fill();
  ctx.save(); smooth(pts); ctx.clip(); ctx.translate(lx * bw * k, ly * bh * k); ctx.fillStyle = base; smooth(pts); ctx.fill(); ctx.restore();
  if (lw > 0) { ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.lineJoin = 'round'; smooth(pts); ctx.stroke(); }
  ctx.restore();
}

// ---------- the camera: parallax layers ----------
// CAM = { x, y, zoom, dolly, tilt, rot }. A layer at depth p moves p times as far as the camera
// (p = 0: sky at infinity, p = 1: the plane in focus, p > 1: foreground). zoom scales every layer
// (a lens), dolly scales near layers more (the camera travelling in), tilt shifts every layer on screen.
let CAM = { x: 0, y: 0, zoom: 1, dolly: 0, tilt: 0, rot: 0 };
function L(p, fn) {
  const c = CAM, k = c.zoom * (1 + c.dolly * p);
  ctx.save(); ctx.translate(W / 2, H / 2 + c.tilt); if (c.rot) ctx.rotate(c.rot); ctx.scale(k, k); ctx.translate(-W / 2 - c.x * p, -H / 2 - c.y * p);
  fn(); ctx.restore();
}
let PX = 1;

// ---------- layout registry (read by layout-check.mjs) ----------
let LAYOUT = [];
function claim(id, kind, x, y, w, h) {
  const m = ctx.getTransform(), P = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, c]) => [m.a * a + m.c * c + m.e, m.b * a + m.d * c + m.f]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  LAYOUT.push({ id, kind, x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
}
const font = (s, w = 400) => LOOK.font.replace('{s}', s).replace('{w}', w);

// ================= painted nature: skies, clouds, leaves, water, rain, light =================

// A cumulus painted lobe by lobe, back (top) to front (bottom): each lobe gets its shadow,
// its mid tone and its sunlit crown, so the lobes read as separate volumes like a painted cloud.
// A cumulus as anime backgrounds paint it: lobes piled back to front, each a lavender shadow mass
// with a crisp sunlit cap and a smaller cream crown, so every lobe ends in a clean crescent of shade.
function cumulus(cx, cy, w, h, seed, pal) {
  const r = rng(seed), puffs = [];
  const n = Math.round(18 + w / 30);
  for (let i = 0; i < n; i++) {
    const u = r(), edge = Math.pow(1 - Math.pow(Math.abs(u - .5) * 2, 1.6), .7);
    const crown = r() < .4;
    const rr = crown ? h * (.07 + .12 * r()) : h * (.1 + .28 * edge * Math.pow(r(), .5));
    const y = crown ? cy - h * .2 - edge * h * (.5 + .35 * r()) : cy - rr * .45 - edge * h * .5 * Math.pow(r(), 1.3);
    puffs.push([cx + (u - .5) * w * (crown ? .8 : 1), y, rr]);
  }
  puffs.sort((a, b) => a[1] - b[1]);
  const sx = 1.22;                                                  // lobes a little wider than tall
  for (const [x, y, rr] of puffs) {
    ell(x, y, rr * sx, rr, pal.shade);
    ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rr * sx, rr, 0, 0, TAU); ctx.clip();
    ell(x - rr * .1, y - rr * .24, rr * sx * .96, rr * .82, pal.mid);
    ell(x - rr * .2, y - rr * .44, rr * sx * .7, rr * .52, pal.light);
    ctx.restore();
  }
  // the flat, shadowed base: only under the bottom lobes
  for (const [x, y, rr] of puffs) if (y > cy - h * .25) { ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rr * sx, rr, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = lin(0, cy - h * .12, 0, cy + h * .05, [[0, rgba(pal.base || pal.shade, 0)], [1, rgba(pal.base || pal.shade, .9)]]); ctx.fillRect(x - rr * 2, cy - h * .12, rr * 4, h * .3); ctx.restore(); }
}
function softDisc(x, y, r, col, a = 1) { ctx.save(); ctx.fillStyle = rad(x, y, 0, r, [[0, rgba(col, a)], [.55, rgba(col, a * .85)], [1, rgba(col, 0)]]); ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
// paint something soft at low resolution (blur is cheap on a small canvas) and return that canvas
function lowres(w, h, k, paint) { const c = mk(w / k, h / k), m = ctx; ctx = c.getContext('2d'); ctx.scale(1 / k, 1 / k); paint(); ctx = m; return c; }

// Leaves: a clump is a dark mass with hundreds of leaf dabs, toned by which way they face the light.
const PAL_RAIN = ['#1c3128', '#27432f', '#3b5d3d', '#5b7a52', '#7d9772'];
const PAL_SUN = [C.leafDeep, C.leafDark, C.leafMid, C.leafLight, C.leafHi];
// A leafy blob: an ellipse with a scalloped edge, and leaf dabs breaking the rim.
function scallop(x, y, rx, ry, col, seed, leaf) {
  const n = Math.max(10, Math.round((rx + ry) / Math.max(4, leaf * .9))), pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, k = 1 + (hash2(i, seed) - .5) * .22 + (i % 2 ? -.06 : .04);
    pts.push([x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k]);
  }
  fillS(pts, col);
  const m = Math.round(n * .7);
  for (let i = 0; i < m; i++) {
    const a = hash2(i, seed + 3) * TAU, k = .92 + hash2(i, seed + 4) * .18;
    if (Math.sin(a) > .55) continue;                                        // the underside stays smooth
    ell(x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k, leaf * (.5 + hash2(i, seed + 5) * .5), leaf * .38, col, a + 1.2);
  }
}
// A clump of foliage painted like an anime background: overlapping leafy masses, each with a
// shadow body, a lit mid tone up and to the left, and a sunlit crown; leaves break every edge.
function clump(x, y, rx, ry, seed, pal, o = {}) {
  const { leaf = 11, lx = -.45, ly = -.9, lit = 1 } = o;
  const r = rng(seed), m = 3 + Math.round(Math.min(9, (rx + ry) / 45)), subs = [];
  for (let i = 0; i < m; i++) {
    const a = r() * TAU, d = Math.sqrt(r()) * .5;
    subs.push([x + Math.cos(a) * rx * d, y + Math.sin(a) * ry * d * .85, rx * (.42 + .3 * r()), ry * (.42 + .3 * r()), i]);
  }
  subs.sort((A, B) => (A[1] - A[3] * .3) - (B[1] - B[3] * .3));
  scallop(x, y + ry * .06, rx * .82, ry * .78, pal[0], seed * 7, leaf);
  for (const [sx, sy, srx, sry, i] of subs) {
    const sd = seed * 13 + i * 31;
    scallop(sx, sy, srx, sry, pal[1], sd, leaf);
    scallop(sx + lx * srx * .14, sy + ly * sry * .2, srx * .78, sry * .68, pal[2], sd + 1, leaf * .9);
    if (lit > .3) scallop(sx + lx * srx * .28, sy + ly * sry * .4, srx * .5, sry * .4, pal[3], sd + 2, leaf * .8);
    if (lit > .6) for (let k = 0; k < 5; k++) { const a = -2.2 + hash2(k, sd) * 1.4; ell(sx + Math.cos(a) * srx * .55 + lx * srx * .2, sy + Math.sin(a) * sry * .55 + ly * sry * .3, leaf * .7, leaf * .3, pal[4], a + 1.3, .9); }
    // a few dark gaps between masses
    for (let k = 0; k < 3; k++) { const a = .3 + hash2(k, sd + 9) * 2.4; ell(sx + Math.cos(a) * srx * .75, sy + Math.sin(a) * sry * .7, leaf * .6, leaf * .28, pal[0], a, .8); }
  }
}
function canopy(spec, seed, pal, o) {                 // spec: [[x, y, rx, ry], ...] drawn back to front
  spec.forEach(([x, y, rx, ry], i) => clump(x, y, rx, ry, seed * 31 + i * 7, pal, o));
}
function trunk(pts, w0, w1, col, lite) {               // a tapering trunk or branch along a polyline
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i], [nx, ny] = pts[Math.min(i + 1, pts.length - 1)], [px, py] = pts[Math.max(i - 1, 0)];
    const dx = nx - px, dy = ny - py, d = Math.hypot(dx, dy) || 1, w = lerp(w0, w1, i / (pts.length - 1)) / 2;
    L.push([x - dy / d * w, y + dx / d * w]); R.push([x + dy / d * w, y - dx / d * w]);
  }
  fillS([...L, ...R.reverse()], col);
  if (lite) strokeS(L, lite, Math.max(1, w0 * .12), false, .5);
}

// Sky gradients
function skyRain(w, h) {
  ctx.fillStyle = lin(0, 0, 0, h, [[0, C.rainSkyTop], [.55, '#97a3a9'], [1, C.rainSkyLow]]); ctx.fillRect(0, 0, w, h);
  const r = rng(11);
  const bands = lowres(w, h, 8, () => { ctx.filter = 'blur(4px)';
    for (let i = 0; i < 26; i++) ell(r() * w, r() * h * .8, 200 + r() * 420, 30 + r() * 60, r() < .5 ? '#5f6b75' : '#c3cacb', 0, .35 + r() * .3); });
  ctx.drawImage(bands, 0, 0, w, h);
}
function skySun(w, h, horizon = .8) {
  ctx.fillStyle = lin(0, 0, 0, h, [[0, C.skyTop], [horizon * .6, C.skyMid], [horizon, C.skyLow], [1, '#e8eee6']]); ctx.fillRect(0, 0, w, h);
}
const CLOUD_PAL = { shade: '#a4b1d4', mid: '#e8e9f0', light: '#fffaf0', rim: '#ffffff', base: '#8f9ec6' };
const CLOUD_PAL_FAR = { shade: '#b4c6de', mid: '#dfe8f1', light: '#f7f7f3', rim: '#fbfbf8', base: '#a9bdd9' };

// ---------- rain: three depths of streaks, a pure function of t ----------
function rain(t, amt, o = {}) {
  if (amt <= .01) return;
  const { slant = .18, col = '#dfe7ea', seed = 1, x0 = 0, y0 = 0, w = W, h = H, scale = 1 } = o;
  ctx.save(); ctx.lineCap = 'round';
  const layers = [[420, 16, .9, .22, 1500], [240, 30, 1.3, .26, 2100], [70, 64, 2.2, .2, 2900]];
  layers.forEach(([n, len, lw, a, v], li) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw * scale; ctx.globalAlpha = a * Math.min(1, amt * 1.2);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      if (hash2(i, 91 + li + seed) > amt) continue;
      const sp = v * (.8 + hash2(i, 7 + li) * .4) * scale, ph = hash2(i, 3 + li + seed);
      const span = h + len * 2 * scale, y = ((t * sp / span + ph) % 1) * span - len * scale + y0;
      const x = x0 + hash2(i, 5 + li + seed) * (w + 300) - 150 + slant * (y - y0);
      ctx.moveTo(x, y); ctx.lineTo(x - slant * len * scale, y - len * scale);
    }
    ctx.stroke();
  });
  ctx.restore();
}
// rings on water / puddles: region [x, y, w, h], perspective squash
function ripples(t, amt, x, y, w, h, n, o = {}) {
  if (amt <= .01) return;
  const { col = '#e3e8e6', squash = .28, size = 26, seed = 4, grow = 1 } = o;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  for (let i = 0; i < n; i++) {
    if (hash2(i, seed) > amt) continue;
    const P = .9 + hash2(i, seed + 1) * .6, cyc = Math.floor(t / P + hash2(i, seed + 2)), k = (t / P + hash2(i, seed + 2)) % 1;
    const px = x + hash2(i * 13 + cyc, seed + 3) * w, py = y + Math.pow(hash2(i * 17 + cyc, seed + 4), .8) * h;
    const depth = .35 + .65 * (py - y) / h, rr = size * depth * (.3 + k * grow);
    ctx.globalAlpha = (1 - k) * .55; ctx.beginPath(); ctx.ellipse(px, py, rr, rr * squash, 0, 0, TAU); ctx.stroke();

function sparkles(t, x, y, w, h, n, amt, seed = 8, s = 7) {        // twinkling glints over a region

// god rays from a point: soft wedges in 'screen'
function rays(x, y, len, a0, a1, n, amt, t, col = '#fff1c9') {

// ---------- film finish: grain, vignette ----------
const GRAIN = [0, 1, 2, 3].map(s => { const c = mk(W / 2, H / 2), g = c.getContext('2d'), d = g.createImageData(c.width, c.height), r = rng(100 + s);

const PAPER = (() => {                                                   // painted-board texture, very faint: blotchy value noise
  const c = mk(240, 135), g = c.getContext('2d'), d = g.createImageData(240, 135);
  for (let y = 0; y < 135; y++) for (let x = 0; x < 240; x++) { const v = 128 + (fbm(x * .09, y * .09) - .5) * 60, i = (y * 240 + x) * 4; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }

const GOUACHE = (() => { const c = mk(W / 2, H / 2), g = c.getContext('2d'), r = rng(31);

  return c; })();

  ctx.fillStyle = rad(W / 2, H / 2, H * .45, H * 1.05, [[0, 'rgba(255,255,255,1)'], [1, `rgba(${Math.round(255 * (1 - vig))},${Math.round(250 * (1 - vig))},${Math.round(245 * (1 - vig))},1)`]]);
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ================= the myna: an anime lead =================
// A chubby Javan myna drawn as a cel character: round body, big round head, a big glossy eye with
// two highlights, a curly forehead tuft, a short yellow bill. Slate blue-black, never pure black,
// with a cool rim light and glossy sheen arcs. 100 units tall, feet at the origin, facing +x.
const BIRD = { body: '#2c3142', shade: '#1b1e2b', sheen: '#7f93c2', rim: '#9fb4e6', beak: '#ffc21f', beakSh: '#e08a12', leg: '#ffb52a', legSh: '#d88a14', white: '#f6f3ea', line: '#191a26' };

// o: { dir, look (head pitch, + up), fluff 0..1, blink 0..1, mood: 'calm'|'happy'|'surprised'|'determined',
//      open (bill 0..1), crumb, glint 0..1, wet 0..1, rot, lw, sunny 0..1, shakeBlur, sweat }
function bird(x, y, s, o = {}) {

  ctx.save(); smooth(tail); ctx.clip(); fillP([[-44, -6], [-30, -8], [-26, 8], [-44, 8]], BIRD.white); ctx.restore();
  strokeS(tail, ln, LW, true);
  // legs: short, cartoon
  const leg = (lx, far) => { const c = far ? BIRD.legSh : BIRD.leg;
    strokeS([[lx, -14], [lx + .5, -2]], ln, 5.4 + LW); strokeS([[lx, -14], [lx + .5, -2]], c, 5.4);
    for (const [tx, ty] of [[lx + 8, 0], [lx + 6, 1.4], [lx - 5, .4]]) { strokeS([[lx + .5, -2], [tx, ty]], ln, 3.4 + LW); strokeS([[lx + .5, -2], [tx, ty]], c, 3.4); } };
  leg(-3, true);
  // body: a plump egg
  const bodyPts = ellPts(0, -38 - fluff * 2, 29 * F, 27 * F, -.35, 30).map(([px, py], i) => fluff > 0 ? [px + Math.sin(i * 2.3) * 1.8 * fluff, py + Math.cos(i * 2.9) * 1.8 * fluff] : [px, py]);

    strokeS(arcPts(12, -78, 18, 16, Math.PI * 1.15, Math.PI * 1.6), sheen, 3, false, .8);

    strokeS([[30, -78], [37, -77.6]], '#fff4bf', 1.4, false, .9);

      ell(cx - 2, cy - 2, 1.8, 1.2, '#e3ac6c'); ell(cx + 2.5, cy + .5, 1.3, 1, '#e3ac6c'); ell(cx - 1, cy + 2, 1, .8, '#6e3c1c'); }

// ================= SET: the river (shots 1, 9, 18, 19) =================
// Looking across the Singapore River: towers in the haze, the far bank's trees and old shophouses,
// the white footbridge, the water, and the near bank's railing and trees. World x runs along the river.
const BANK = 612;                                              // far-bank waterline (world y)

function towerShape(x, base, w, h, seed, o = {}) {
  const r = rng(seed), { col = '#a9b6c1', sh = '#7f8f9d', lite = '#dfe7ec', glass = '#6f8597' } = o;
  const style = seed % 3;
  rectF(x, base - h, w, h, col);
  rectF(x + w * .64, base - h, w * .36, h, sh);
  // balcony bands and glass
  for (let y = base - h + 18; y < base; y += 13) {
    rectF(x + 3, y, w * .64 - 6, 4, glass, .55); rectF(x + w * .64 + 2, y, w * .36 - 5, 4, shade(glass, .8), .55);
    rectF(x, y + 4, w, 1.6, lite, .45);
  }
  if (style === 1) for (let y = base - h + 40; y < base; y += 78) {        // stacked, jutting boxes
    const jx = x + (r() < .5 ? -14 : w - 10); rectF(jx, y, 24, 44, col); rectF(jx + 14, y, 10, 44, sh); rectF(jx, y + 20, 24, 3, glass, .6);
  }
  if (style === 2) { rectF(x + w * .3, base - h - 26, w * .4, 26, sh); rectF(x + w * .45, base - h - 60, 3, 36, sh); }
  rectF(x - 2, base - h - 4, w + 4, 6, shade(col, .9));
}
function shophouse(x, base, w, h, col, seed) {             // the cream colonial blocks of the far bank
  const r = rng(seed);
  rectF(x, base - h, w, h, col); rectF(x - 4, base - h - 8, w + 8, 10, shade(col, .88));
  rectF(x, base - h * .52, w, 6, shade(col, .85));
  for (let i = 0; i < Math.floor(w / 34); i++) {
    const wx = x + 12 + i * 34;
    rectF(wx, base - h + 18, 14, h * .3, '#5f6f72', .8); rectF(wx, base - h * .44, 14, h * .32, '#4f5c60', .85);
    rectF(wx - 3, base - h + 16, 20, 3, shade(col, 1.2));
    if (r() < .5) rectF(wx - 2, base - h * .44, 18, 6, r() < .5 ? '#2d7d8a' : '#c46a3c', .8);        // shutters / awnings
  }
  rectF(x + w - w * .18, base - h, w * .18, h, 'rgba(60,50,40,.12)');
}
function footbridge(x, y, w, sun) {                        // a white cable-stayed footbridge, seen across the water

  const bus = (g, send) => { const b = ac.createGain(); b.gain.value = g; b.connect(master); const s = ac.createGain(); s.gain.value = send; b.connect(s); s.connect(rev); return b; };
  const MUS = bus(1, .8), FX = bus(.9, .35), AMB = bus(1, .15);
  const noise = (() => { const n = SR * 2, b = ac.createBuffer(1, n, SR), d = b.getChannelData(0); let s = 9; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x7fffffff * 2 - 1; } return b; })();

  // ---- instruments ----
  function tone(dest, t, f, type, peak, a, d, pan = 0, stop) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.value = f; p.pan.value = pan;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0, t + a, d);
    if (stop) g.gain.setTargetAtTime(0, stop, .12);
    o.connect(g); g.connect(p); p.connect(dest); o.start(t); o.stop((stop ? Math.min(stop + .8, t + a + d * 8) : t + a + d * 8));
  }
  const pianoBus = ac.createBiquadFilter(); pianoBus.type = 'lowpass'; pianoBus.frequency.value = 4200; pianoBus.connect(MUS);
  function piano(t, m, v = .5, dur = 2, pan = 0) {
    const f = hz(m), d = clamp(3 - (m - 48) * .045, .5, 3);
    [[1, 1], [2.003, .42], [3.01, .18], [4.02, .09], [5.03, .04]].forEach(([k, a], i) => tone(pianoBus, T0 + t, f * k, i ? 'sine' : 'triangle', .16 * v * a, .004, d / Math.pow(k, .8), pan, T0 + t + dur));
    tone(pianoBus, T0 + t, f * .5, 'sine', .03 * v, .004, d * .6, pan, T0 + t + dur);
  }
  function strings(t, m, dur, v = .5, pan = 0, cut = 2000) {
    const s = T0 + t, e = s + dur, f = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner(); f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = .6; p.pan.value = pan;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.045 * v, s + Math.min(.6, dur * .4)); g.gain.setValueAtTime(.045 * v, Math.max(s + .6, e - .2)); g.gain.setTargetAtTime(0, e, .35);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 5.1; lg.gain.setValueAtTime(0, s); lg.gain.linearRampToValueAtTime(7, s + .8); lfo.connect(lg);
    [-8, 0, 7].forEach(dt => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = dt; lg.connect(o.detune); o.connect(f); o.start(s); o.stop(e + 2.5); });
    lfo.start(s); lfo.stop(e + 2.5); f.connect(g); g.connect(p); p.connect(MUS);
  }
  const celesta = (t, m, v = .5, pan = 0) => { const f = hz(m); tone(MUS, T0 + t, f, 'sine', .09 * v, .003, .7, pan); tone(MUS, T0 + t, f * 4.01, 'sine', .025 * v, .002, .12, pan); tone(MUS, T0 + t, f * 2, 'sine', .03 * v, .002, .3, pan); };
  const pizz = (t, m, v = .5, pan = 0) => { tone(MUS, T0 + t, hz(m), 'triangle', .17 * v, .004, .13, pan); tone(MUS, T0 + t, hz(m) * 2, 'sine', .05 * v, .003, .06, pan); };
  function noiseHit(dest, t, type, f, q, peak, a, d, f2, glide, pan = 0) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner(); s.buffer = noise; s.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, T0 + t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, T0 + t + glide); fl.Q.value = q; p.pan.value = pan;
    g.gain.setValueAtTime(0, T0 + t); g.gain.linearRampToValueAtTime(peak, T0 + t + a); g.gain.setTargetAtTime(0, T0 + t + a, d);
    s.connect(fl); fl.connect(g); g.connect(p); p.connect(dest); s.start(T0 + t, rnd()); s.stop(T0 + t + a + d * 8);
  }
  function bed(type, f, q, curve, pan = 0, f2curve) {            // a continuous ambience whose level follows curve(t)
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner(); s.buffer = noise; s.loop = true;
    fl.type = type; fl.frequency.value = f; fl.Q.value = q; p.pan.value = pan; g.gain.setValueAtTime(0, T0);
    for (let t = 0; t <= DUR; t += .25) { g.gain.linearRampToValueAtTime(curve(t), T0 + t); if (f2curve) fl.frequency.linearRampToValueAtTime(f2curve(t), T0 + t); }
    s.connect(fl); fl.connect(g); g.connect(p); p.connect(AMB); s.start(T0); s.stop(T0 + DUR);
  }

  // ---- harmony ----
  const CH = { Gmaj7: [43, [59, 62, 66, 69]], 'F#m7': [42, [57, 61, 64, 69]], Em7: [40, [55, 59, 62, 66]], A7sus: [45, [57, 62, 64, 67]], A: [45, [57, 61, 64, 69]],
    Bm7: [47, [57, 62, 66, 69]], Gmaj9: [43, [57, 59, 62, 66]], D: [38, [57, 62, 64, 66]], 'D/F#': [42, [57, 62, 66, 69]], 'A/C#': [49, [57, 61, 64, 69]],
    G: [43, [55, 59, 62, 67]], Asus: [45, [57, 62, 64, 69]], 'F#7': [42, [58, 61, 64, 70]], Em9: [40, [54, 59, 62, 67]] };
  const BARS = ['Gmaj7', 'F#m7', 'Em7', 'A7sus', 'Bm7', 'Gmaj9', ['Asus', 'A'], 'D', 'Bm7', ['Gmaj7', 'A'], 'D/F#', 'G', 'Em7', 'A', ['Bm7', 'G'],
    'Asus', 'D', 'A/C#', 'Bm7', 'F#m7', 'Gmaj7', ['A7sus', 'A'], 'Em9', 'F#7', ['G', 'A'], 'D', 'A/C#', ['Bm7', 'G'], ['Gmaj7', 'A'], 'D'];
  const chordAt = beat => { const bar = Math.floor(beat / 4), c = BARS[bar]; return CH[Array.isArray(c) ? c[(beat % 4) < 2 ? 0 : 1] : c]; };
  const B = BEAT;
  // pad under everything but the heist, the texture changing by section
  for (let bar = 0; bar < 30; bar++) {
    const c = BARS[bar], halves = Array.isArray(c) ? c : [c, c];
    halves.forEach((name, h) => {
      const t = bar * 3 + h * 1.5, [root, v] = CH[name], len = 1.5;
      if (h === 1 && halves[0] === halves[1]) return;
      const full = halves[0] === halves[1] ? 3 : 1.5;
      if (bar >= 22 && bar <= 24) return;
      const vol = bar < 7 ? .35 : bar < 15 ? .45 : bar === 15 ? .3 : bar < 22 ? .8 : 1;
      v.forEach((m, i) => strings(t, m, full, vol * (i === 0 ? .8 : .6), (i - 1.5) * .3, bar >= 16 ? 2400 : 1300));
      if (bar !== 15) { strings(t, root, full, vol * .9, 0, 700); piano(t, root, bar < 7 ? .45 : .55, full); }
    });
  }
  // left-hand piano arpeggio (bars 7-14 and 16-21, 25-28)
  const PAT = [0, 2, 1, 3, 2, 1, 3, 2];
  for (let e = 0; e < 240; e++) {
    const bar = Math.floor(e / 8); if (!((bar >= 7 && bar <= 14) || (bar >= 16 && bar <= 21) || (bar >= 25 && bar <= 28))) continue;
    const [root, v] = chordAt(e / 2), m = v[PAT[e % 8]] - (bar >= 16 ? 0 : 0);
    piano(e * B / 2, m, (e % 8 === 0 ? .42 : .3) * (bar >= 25 ? 1.1 : 1), B, (e % 2 ? .25 : -.25));
  }
  // rain-drop piano in the opening: single high notes, sparse
  for (let beat = 2; beat < 28; beat++) { if (beat % 3 === 1) continue; const [, v] = chordAt(beat); piano(beat * B + (beat % 2) * B * .5, v[(beat * 7) % 4] + 24, .28, 1.5, (beat % 5 - 2) * .2); }
  // the melody
  const A1 = [[0, 78, 1.5], [1.5, 76, .5], [2, 74, 1], [3, 69, 1], [4, 71, 1.5], [5.5, 73, .5], [6, 74, 1], [7, 76, 1], [8, 78, 1.5], [9.5, 81, .5], [10, 79, 1], [11, 78, .5], [11.5, 76, .5], [12, 76, 3]];
  const B1 = [[0, 74, 1.5], [1.5, 76, .5], [2, 78, 1], [3, 83, 1], [4, 81, 2], [6, 78, 1], [7, 76, 1], [8, 74, 1.5], [9.5, 76, .5], [10, 78, 1], [11, 76, .5], [11.5, 74, .5], [12, 73, 2], [14, 74, 2]];
  const play = (notes, bar0, fn) => notes.forEach(([b0, m, d]) => fn(bar0 * 3 + b0 * B, m, d * B));
  play(A1, 7, (t, m, d) => piano(t, m, .7, d + .2, .1));
  play(B1, 11, (t, m, d) => piano(t, m, .7, d + .2, .1));
  play(A1, 16, (t, m, d) => { strings(t, m, d, 1.1, .1, 3000); piano(t, m + 12, .45, d, .2); });
  play(B1.slice(8), 18, (t, m, d) => { strings(t, m, d, 1.1, .1, 3000); piano(t, m + 12, .45, d, .2); });
  play(A1, 25, (t, m, d) => { strings(t, m + 12, d, 1, .15, 3600); strings(t, m, d, .8, -.15, 2800); piano(t, m + 12, .5, d, .2); celesta(t, m + 12, .35, .3); });
  strings(87, 74 + 12, 3, 1, .1, 3600); strings(87, 78, 3, .8, -.1, 2800); piano(87, 74 + 12, .55, 3); celesta(87, 86, .4); celesta(87.25, 90, .35); celesta(87.5, 93, .3);
  // the heist: pizzicato, a rest, then the leap
  const PZ = [[0, 64], [.5, 67], [1, 71], [2, 69], [2.5, 67], [3, 64], [4, 66], [4.5, 70], [6, 78], [7, 76], [8, 71], [8.5, 74], [9, 79], [10, 76], [10.5, 73], [11, 69]];
  PZ.forEach(([b0, m]) => { pizz(66 + b0 * B, m, .8, (m % 3 - 1) * .3); });
  for (let bt = 0; bt < 12; bt++) if (bt !== 5) pizz(66 + bt * B, chordAt(88 + bt)[0] + (bt % 2 ? 12 : 0), .9, 0);
  // the break before the sun: a rising celesta run
  [69, 71, 73, 74, 76, 78, 81, 83, 85, 86, 88, 90].forEach((m, i) => celesta(46.2 + i * .14, m, .4 + i * .03, (i % 2 ? .3 : -.3)));
  // a soft accent on every cut so the edit is heard in the harmony
  window.CUES.forEach(c => { const [root] = chordAt(Math.round(c / B)); piano(c, root + 12, .5, 1.2, 0); });

  // ---- ambience ----
  const inside = t => t > 29.6 && t < 45 ? 1 : 0;
  bed('bandpass', 2600, .5, t => .09 * RAIN(t) * (1 - .75 * inside(t)), -.2, t => inside(t) ? 900 : 2600);
  bed('lowpass', 500, .7, t => .06 * RAIN(t) * (1 - .6 * inside(t)), .2);
  bed('bandpass', 450, 1.2, t => .025 * inside(t), 0);                       // room tone
  bed('lowpass', 700, .5, t => t > 48 ? .03 : 0, 0);                          // the river
  for (let t = 48.5; t < 88; t += .9 + rnd() * 2.2) { const f = 2600 + rnd() * 1800; tone(AMB, T0 + t, f, 'sine', .012, .01, .05, rnd() - .5); tone(AMB, T0 + t + .09, f * 1.12, 'sine', .01, .01, .05, rnd() - .5); }
  for (let t = 1; t < 24; t += .35 + rnd() * .9) tone(AMB, T0 + t, 1800 + rnd() * 1600, 'sine', .006 * RAIN(t), .002, .03, rnd() * 2 - 1);

  // ---- sound effects ----
  const chirp = (t, k) => { const base = 2200 + (k % 3) * 260; for (let i = 0; i < 3; i++) { const o = ac.createOscillator(), g = ac.createGain(), s = T0 + t + i * .11;
    o.type = 'sine'; o.frequency.setValueAtTime(base * (1 + i * .08), s); o.frequency.exponentialRampToValueAtTime(base * (1.45 - i * .05), s + .06);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.05, s + .01); g.gain.setTargetAtTime(0, s + .05, .02); o.connect(g); g.connect(FX); o.start(s); o.stop(s + .2); } };
  const SFX = {
    drip: t => tone(FX, T0 + t, 1400 + rnd() * 600, 'sine', .05, .002, .05, rnd() - .5),
    plop: t => { const o = ac.createOscillator(), g = ac.createGain(), s = T0 + t; o.frequency.setValueAtTime(700, s); o.frequency.exponentialRampToValueAtTime(1600, s + .06); g.gain.setValueAtTime(.09, s); g.gain.setTargetAtTime(0, s + .03, .03); o.connect(g); g.connect(FX); o.start(s); o.stop(s + .3); },
    flutter: t => { for (let i = 0; i < 9; i++) noiseHit(FX, t + i * .07, 'bandpass', 2200, 1.2, .07 * (1 - i / 10), .005, .03); },
    chirp: (t, k) => chirp(t, k),
    step: (t, i) => noiseHit(FX, t, 'lowpass', 900, .8, .04, .003, .03, null, 0, i % 2 ? .15 : -.15),
    swish: t => noiseHit(FX, t, 'bandpass', 600, 1.5, .08, .2, .12, 3000, .5),
    snap: t => { noiseHit(FX, t, 'highpass', 3000, 1, .06, .001, .01); tone(FX, T0 + t, 380, 'triangle', .05, .001, .03); },
    bell: t => { tone(FX, T0 + t, 2637, 'sine', .05, .002, .5, .3); tone(FX, T0 + t + .12, 3136, 'sine', .04, .002, .5, .3); tone(FX, T0 + t, 7900, 'sine', .01, .001, .1, .3); },
    clink: t => { tone(FX, T0 + t, 3400 + rnd() * 900, 'sine', .025, .001, .08, rnd() - .5); tone(FX, T0 + t, 5200, 'sine', .01, .001, .04); },
    steam: t => noiseHit(FX, t, 'bandpass', 4200, .8, .05, .15, .5, 5200, 1),
    pour: t => { for (let i = 0; i < 18; i++) noiseHit(FX, t + i * .23, 'lowpass', 700 + (i % 3) * 120, 2, .02, .05, .1); },
    sparkle: (t, i) => celesta(t, [86, 88, 90, 93, 95, 93, 98, 100, 102][i] - 12, .35, (i % 2 ? .4 : -.4)),
    gliss: t => noiseHit(FX, t, 'bandpass', 800, .7, .03, 1.2, .5, 5000, 1.6),
    plate: (t, i) => { tone(FX, T0 + t, 720 + i * 40, 'triangle', .07, .001, .06, (i % 3 - 1) * .4); tone(FX, T0 + t, 1900 + i * 70, 'sine', .03, .001, .12, (i % 3 - 1) * .4); noiseHit(FX, t, 'lowpass', 1200, 1, .04, .002, .02); },
    focus: t => noiseHit(FX, t, 'lowpass', 300, .7, .03, .3, .25, 900, .6),
    ting: t => { celesta(t, 98, .6, .1); celesta(t + .08, 105, .4, .1); },
    flap: t => { for (let i = 0; i < 4; i++) noiseHit(FX, t + i * .09, 'bandpass', 900, .9, .09 * (1 - i * .15), .01, .05, 400, .08); },
    land: t => { noiseHit(FX, t, 'lowpass', 800, 1, .06, .002, .03); tone(FX, T0 + t + .02, 3150, 'sine', .03, .001, .35, -.3); tone(FX, T0 + t + .05, 4300, 'sine', .02, .001, .3, .2); },
    peck: t => { tone(FX, T0 + t, 1500, 'triangle', .06, .001, .02); noiseHit(FX, t, 'highpass', 2500, 1, .03, .001, .01); },
    tilt: t => chirp(t, 5),
    preen: t => { for (let i = 0; i < 5; i++) noiseHit(FX, t + i * .16, 'bandpass', 3200, 1.5, .025, .01, .04); },
    perch: t => { noiseHit(FX, t, 'lowpass', 900, 1, .05, .002, .03); tone(FX, T0 + t, 260, 'triangle', .04, .002, .05); },
    trill: t => { for (let i = 0; i < 6; i++) chirp(t + i * .09, i % 3); celesta(t + .1, 93, .4); celesta(t + .25, 98, .35); },
    whoosh: t => noiseHit(FX, t, 'bandpass', 400, 1, .1, .18, .12, 2400, .35),
    wing: (t, i) => noiseHit(FX, t, 'bandpass', 700, .9, .035, .01, .05, 350, .08, (i % 2 ? .2 : -.2)),
  };
  for (const [t, name, arg] of EVENTS) SFX[name](t, arg);
}
window.SCORE = ac => buildFilm(ac);

// ================= draw(frame): pure function of the frame number =================
function drawShot(S, t) { S.fn(t, t - S.from, S); }
function draw(frame) {
  const t = frame / FPS; LAYOUT = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const i = SHOTS.findIndex(s => t >= s.from && t < s.to), S = SHOTS[i < 0 ? SHOTS.length - 1 : i];
  drawShot(S, t);
  // dissolve: the next shot fades in over the tail of this one (cut time = dissolve midpoint)
  const N = SHOTS[i + 1];
  if (N && N.dissolve && t > N.from - N.dissolve / 2) {
    const k = prog(t, N.from - N.dissolve / 2, N.from + N.dissolve / 2);
    onLayer(SCR[0], () => drawShot(N, t)); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = easeIO(k); ctx.drawImage(SCR[0], 0, 0); ctx.restore();
  }
  if (S.dissolve && t < S.from + S.dissolve / 2 && i > 0) {
    const P = SHOTS[i - 1], k = prog(t, S.from - S.dissolve / 2, S.from + S.dissolve / 2);
    onLayer(SCR[0], () => drawShot(P, t)); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 - easeIO(k); ctx.drawImage(SCR[0], 0, 0); ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  finish(frame, S.grade || {});
  overlays(t);
  // fade from black at the start, to black at the very end
  const fade = Math.max(1 - prog(t, 0, 2.2), prog(t, DUR - 1.2, DUR));
  if (fade > 0) rectF(0, 0, W, H, '#000', easeIO(fade));
  window.LAYOUT = LAYOUT;
}
window.draw = draw; window.FRAMES = FRAMES; window.FPS = FPS;
window.CUES = SHOTS.slice(1).map(s => s.from);

// live preview when opened directly in a browser (render.mjs loads the page with ?render)
if (!new URLSearchParams(location.search).has('render')) {
  let start = performance.now(), playing = false;
  const loop = () => { draw(Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); };
  loop();
  // browsers only allow sound after a user gesture: click restarts from 0 with the score playing
  addEventListener('click', () => { if (playing || !window.SCORE) return; playing = true; const ac = new AudioContext(); window.SCORE(ac); start = performance.now() + 50; });
}
</script>
