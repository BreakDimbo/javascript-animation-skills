<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>宝箱高光时刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Lilita+One&family=ZCOOL+KuaiLe&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#1A1033;
  --bgA:#2F7A3E; --bgB:#0A1F12; --ray:rgba(184,255,154,.2); --glow:#7DFF6A; --tl:#A6FF86; --tm:#45C653;
  --fx:50%; --fy:50%; --fr:10vmax; --cx:50%; --cy:60%; --hx:50%; --hy:42%;
  --en:'Titan One','Lilita One',system-ui,sans-serif;
  --zh:'ZCOOL KuaiLe','Titan One',"PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
  --metal-steel:linear-gradient(160deg,#F4F7FC 0%,#B9C2D3 30%,#7D879C 48%,#C9D1DF 62%,#8A94A8 82%,#D7DEEA 100%);
  --metal-silver:linear-gradient(160deg,#FFFFFF 0%,#D6E2F3 28%,#8FA3C2 47%,#E3ECF8 63%,#9DB0CC 82%,#EEF4FC 100%);
  --metal-gold:linear-gradient(160deg,#FFF8D6 0%,#FFD66B 26%,#D8901A 47%,#FFE39A 62%,#C47E12 82%,#FFEDB0 100%);
  --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,rgba(0,0,0,.06) 1px 2px,rgba(255,255,255,0) 2px 4px);
  --bevel:inset 2px 2px 0 rgba(255,255,255,.75),inset -2px -3px 0 rgba(0,0,0,.32),inset 0 0 6px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0B0718;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:var(--zh);color:#fff}
#app{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#stage{position:absolute;inset:0;will-change:transform}
.layer{position:absolute;inset:0;pointer-events:none}
canvas.layer{width:100%;height:100%}

/* ---------- background: tier gradient + three soft conic ray layers ---------- */
#bg .grad{position:absolute;inset:0;background:radial-gradient(120% 85% at var(--cx) var(--cy),var(--bgA) 0%,var(--bgB) 72%)}
.rays{position:absolute;left:var(--cx);top:var(--cy);width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 16%,rgba(0,0,0,0) 40%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 16%,rgba(0,0,0,0) 40%)}
.rays.r1{background:repeating-conic-gradient(from 0deg,rgba(0,0,0,0) 0deg,color-mix(in srgb,var(--ray) 40%,transparent) 4deg,var(--ray) 7.5deg,color-mix(in srgb,var(--ray) 40%,transparent) 11deg,rgba(0,0,0,0) 15deg)}
.rays.r2{opacity:.75;background:repeating-conic-gradient(from 9deg,rgba(0,0,0,0) 0deg,color-mix(in srgb,var(--ray) 35%,transparent) 8deg,var(--ray) 15deg,color-mix(in srgb,var(--ray) 35%,transparent) 22deg,rgba(0,0,0,0) 30deg)}
.rays.r3{opacity:.5;background:repeating-conic-gradient(from 2deg,rgba(0,0,0,0) 0deg,var(--ray) 2.5deg,rgba(0,0,0,0) 5deg)}
#bg .vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 55%,rgba(0,0,0,0) 45%,rgba(6,2,16,.65) 100%)}

/* ---------- reveal curtain: clean gradient + slow soft light ---------- */
#curtain{opacity:0;background:radial-gradient(80% 62% at var(--hx) var(--hy),#FFE9B0 0%,#F4B24C 32%,#B95A1A 66%,#4A1806 100%)}
#curtain .soft{position:absolute;left:var(--hx);top:var(--hy);width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;mix-blend-mode:screen;
  background:conic-gradient(from 0deg,rgba(255,248,220,0) 0deg,rgba(255,248,220,.26) 28deg,rgba(255,248,220,0) 62deg,rgba(255,248,220,0) 118deg,rgba(255,248,220,.2) 150deg,rgba(255,248,220,0) 184deg,rgba(255,248,220,0) 238deg,rgba(255,248,220,.24) 270deg,rgba(255,248,220,0) 304deg,rgba(255,248,220,0) 360deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,#000 10%,rgba(0,0,0,0) 50%);mask-image:radial-gradient(circle,#000 0%,#000 10%,rgba(0,0,0,0) 50%)}

/* ---------- light pillar: 7 blurred beams + soft core ---------- */
#beams{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none}
.beam{position:absolute;bottom:0;transform-origin:50% 100%;border-radius:50% 50% 0 0;mix-blend-mode:screen;filter:blur(9px);
  background:linear-gradient(to top,color-mix(in srgb,var(--glow) 70%,#fff) 0%,color-mix(in srgb,var(--glow) 55%,transparent) 30%,rgba(0,0,0,0) 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(90deg,transparent,#000 32%,#000 68%,transparent)}
.beam-core{position:absolute;width:300px;height:220px;left:-150px;top:-120px;border-radius:50%;mix-blend-mode:screen;filter:blur(14px);
  background:radial-gradient(closest-side,rgba(255,255,255,.95),color-mix(in srgb,var(--glow) 70%,transparent) 45%,rgba(0,0,0,0) 100%)}

#shadow{position:absolute;left:0;top:0;width:100px;height:26px;margin:-13px 0 0 -50px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(8,3,20,.62),rgba(8,3,20,.34) 55%,rgba(8,3,20,0) 100%)}
#heroGlow{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;border-radius:50%;filter:blur(8px);
  background:radial-gradient(closest-side,rgba(255,255,240,1) 0%,rgba(255,240,170,.95) 50%,rgba(255,205,90,.55) 74%,rgba(255,170,40,0) 100%)}
#flash{opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--fx) var(--fy),color-mix(in srgb,var(--glow) 25%,#fff) 0,color-mix(in srgb,var(--glow) 70%,#fff) calc(var(--fr)*.18),color-mix(in srgb,var(--glow) 40%,transparent) calc(var(--fr)*.55),rgba(0,0,0,0) var(--fr))}

/* ---------- UI ---------- */
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
#ui button{pointer-events:auto}
#title{position:absolute;left:0;right:0;top:64px;text-align:center}
.title-main{font-family:var(--en);font-size:clamp(34px,10.5vw,70px);line-height:1.05;white-space:nowrap;letter-spacing:.01em;filter:drop-shadow(0 5px 0 rgba(26,16,51,.55))}
.ch{display:inline-block;transform-origin:50% 90%}
.chi{display:inline-block;transform-origin:50% 100%;color:var(--tl);-webkit-text-stroke:.15em var(--ink);paint-order:stroke fill;
  text-shadow:0 .07em 0 var(--ink)}
.plate{position:relative;display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:5px 26px 6px;border-radius:999px;border:3px solid var(--ink);
  font-size:18px;line-height:1.2;color:var(--ink);background:var(--brush),var(--metal-steel);box-shadow:var(--bevel),0 4px 0 var(--ink)}
.plate.t1,.plate.t2{background:var(--brush),var(--metal-silver)}
.plate.t3{background:var(--brush),var(--metal-gold);margin-top:20px}
.plate .inl{width:14px;height:14px;flex:none}
.inl-rivet{border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0,#C7CFDD 35%,#5F687C 80%)}
.inl-gem{position:relative;border-radius:50%;border:2px solid var(--ink);background:conic-gradient(#fff,#9AA9C2,#fff,#8697B4,#fff)}
.inl-gem::after{content:'';position:absolute;inset:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(135deg,#fff 0%,var(--gemc,#3FB6FF) 40%,color-mix(in srgb,var(--gemc,#3FB6FF) 60%,#000) 100%)}
.inl-dia{position:relative;border-radius:50%;border:2px solid var(--ink);background:conic-gradient(#FFF6C8,#D18B14,#FFF6C8,#B87510,#FFF6C8)}
.inl-dia::after{content:'';position:absolute;inset:1px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:linear-gradient(135deg,#fff 0%,#BFF4FF 45%,#58B8E8 100%)}
.crown{position:absolute;left:50%;top:-19px;width:30px;height:20px;margin-left:-15px;display:none}
.crown::before,.crown::after{content:'';position:absolute;clip-path:polygon(0 100%,0 25%,25% 60%,50% 0,75% 60%,100% 25%,100% 100%)}
.crown::before{inset:0;background:var(--ink)}
.crown::after{inset:3px 3px 2px;background:linear-gradient(#FFF4B8,#FFC23A 55%,#D98A10)}
.plate.t3 .crown{display:block}
#pips{display:flex;justify-content:center;gap:8px;margin-top:10px}
.pip{width:14px;height:14px;transform:rotate(45deg);border:2.5px solid var(--ink);border-radius:3px;background:#3A2E55;transition:background .25s}

#cards{position:absolute;left:0;right:0;top:40%;display:flex;justify-content:center;align-items:flex-start;gap:12px;--cw:100px}
.rcard{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);opacity:0}
.rc-in{position:absolute;inset:0;transform-origin:50% 100%}
.rc-frame{position:absolute;inset:0;border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:var(--ink);box-shadow:0 4px 0 var(--ink),0 10px 16px rgba(0,0,0,.4)}
.rc-ring{position:absolute;left:50%;top:50%;width:220%;height:220%;margin:-110% 0 0 -110%;display:none;
  background:conic-gradient(#FF4D6D,#FFB13D,#FFF15C,#5CFF8A,#3DE0FF,#5B7BFF,#C45BFF,#FF4D6D)}
.rar-3 .rc-ring{display:block}
.rc-metal{position:absolute;inset:0;padding:7%;border-radius:11px;background:var(--brush),var(--metal-steel);box-shadow:var(--bevel)}
.rar-1 .rc-metal,.rar-2 .rc-metal{background:var(--brush),var(--metal-silver)}
.rar-3 .rc-metal{inset:4px;background:var(--brush),var(--metal-gold)}
.rc-metal canvas{display:block;width:100%;height:100%;border-radius:8px;border:2px solid var(--ink)}
.rc-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 65%);background-size:260% 100%;background-position:120% 0;mix-blend-mode:screen}
.rc-rivet{position:absolute;width:11%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0,#C7CFDD 35%,#5F687C 80%)}
.rc-bezel{position:absolute;left:50%;top:-9%;width:30%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:3px solid var(--ink);box-shadow:inset 2px 2px 0 rgba(255,255,255,.8),inset -2px -2px 0 rgba(0,0,0,.3),0 3px 0 var(--ink)}
.rc-bezel.silver{background:conic-gradient(#fff,#9AA9C2,#fff,#8697B4,#fff)}
.rc-bezel.gold{background:conic-gradient(#FFF6C8,#D18B14,#FFF6C8,#B87510,#FFF6C8)}
.rc-bezel i{position:absolute;inset:16%;clip-path:polygon(50% 0,100% 45%,50% 100%,0 45%);background:linear-gradient(135deg,#fff 0%,var(--gemc) 42%,color-mix(in srgb,var(--gemc) 55%,#000) 100%)}
.rc-bezel .crown{display:block;top:-62%;width:74%;height:52%;margin-left:-37%}
.rc-qty{position:absolute;left:-10%;right:-10%;bottom:6%;text-align:center;font-family:var(--en);font-size:max(16px,calc(var(--cw)*.22));color:#fff;
  -webkit-text-stroke:.17em var(--ink);paint-order:stroke fill;text-shadow:0 .09em 0 var(--ink);white-space:nowrap}
.rc-new{position:absolute;top:16%;right:-16%;font-family:var(--en);font-size:max(13px,calc(var(--cw)*.17));line-height:1;padding:4px 7px 5px;border-radius:9px;border:3px solid var(--ink);
  color:#fff;background:linear-gradient(#FF8A8A,#F0304F 55%,#C0183A);box-shadow:inset 2px 2px 0 rgba(255,255,255,.55),0 3px 0 var(--ink);-webkit-text-stroke:.12em var(--ink);paint-order:stroke fill;opacity:0}

/* info panel */
#panel{position:absolute;left:0;top:0;width:min(340px,calc(100vw - 32px));padding:14px 14px 10px;transform-origin:50% 0;border-radius:20px;opacity:0;
  background:linear-gradient(#2E1C55,#1B0F36) padding-box,var(--brush) border-box,var(--metal-gold) border-box;border:6px solid transparent;
  box-shadow:0 0 0 3px var(--ink),0 7px 0 3px var(--ink),inset 0 6px 16px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,220,120,.25)}
#panel .p-gem{position:absolute;left:50%;top:-22px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid var(--ink);
  background:conic-gradient(#FFF6C8,#D18B14,#FFF6C8,#B87510,#FFF6C8);box-shadow:inset 2px 2px 0 rgba(255,255,255,.8),0 3px 0 var(--ink)}
#panel .p-gem i{position:absolute;inset:6px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:linear-gradient(135deg,#fff,#BFF4FF 45%,#58B8E8)}
#panel .p-gem .crown{display:block;top:-19px}
.p-head{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.p-elem{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:18px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#FFD27A,#FF6A2A 60%,#B8250F);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.p-name{font-size:28px;line-height:1;color:#FFE680;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.p-sub{font-size:16px;color:#F1E6FF;opacity:.9}
.p-stars{position:absolute;right:16px;top:20px;display:flex;gap:3px}
.p-star{width:17px;height:17px;position:relative}
.p-star::before,.p-star::after{content:'';position:absolute;clip-path:polygon(50% 0,63% 34%,100% 36%,71% 59%,81% 96%,50% 75%,19% 96%,29% 59%,0 36%,37% 34%)}
.p-star::before{inset:0;background:var(--ink)}
.p-star::after{inset:3px;background:linear-gradient(#FFF6B0,#FFC52E 55%,#F08A00)}
.p-rows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.p-row{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.p-lbl{font-size:15px;color:#D9C8FF}
.p-val{font-family:var(--en);font-size:20px;line-height:1.1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.p-up{font-family:var(--en);font-size:15px;line-height:1.1;color:#7CFF6B;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;opacity:0}
.p-power{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:8px}
.p-power span{font-size:18px;color:#FFE9A8}
.p-power b{font-family:var(--en);font-weight:400;font-size:30px;color:#FFE680;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}

/* tap hint + buttons */
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;opacity:0}
#hint span{display:inline-block;font-size:21px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
#hint .tap{display:inline-block;width:12px;height:12px;margin:0 8px 3px;border-radius:50%;background:#fff;border:3px solid var(--ink);vertical-align:middle}
.btn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);display:none;font-family:var(--zh);font-size:24px;line-height:1;
  padding:13px 38px 15px;border-radius:18px;border:3px solid var(--ink);color:#fff;cursor:pointer;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  background:var(--brush),linear-gradient(#FFE58A 0%,#FFB626 48%,#F08C00 52%,#FFBE4A 100%);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.6),inset -3px -4px 0 rgba(140,60,0,.45),inset 0 0 8px rgba(0,0,0,.2),0 6px 0 var(--ink),0 12px 18px rgba(0,0,0,.35)}
.btn.green{background:var(--brush),linear-gradient(#B8FF8A 0%,#52D65A 48%,#2DAA3E 52%,#6BE06A 100%)}
.btn:active{translate:0 3px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.6),inset -3px -4px 0 rgba(140,60,0,.45),0 3px 0 var(--ink)}
.btn .gem-l,.btn .gem-r{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff,#C7CFDD 35%,#5F687C 80%)}
.btn .gem-l{left:10px}.btn .gem-r{right:10px}

/* HUD */
#hud{position:absolute;z-index:6;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:center;gap:6px;pointer-events:none}
#hud > *{pointer-events:auto}
.seg{display:flex;padding:3px;border-radius:14px;border:3px solid var(--ink);background:var(--brush),var(--metal-steel);box-shadow:var(--bevel),0 3px 0 var(--ink)}
.seg button{font-family:var(--zh);font-size:15px;line-height:1;white-space:nowrap;padding:7px 11px;border:0;border-radius:9px;background:transparent;color:#2A2045;cursor:pointer}
.seg button.on{color:#fff;background:linear-gradient(#8F7BFF,#5B3FD6);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.3);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.seg.lock{opacity:.55;pointer-events:none}
.spacer{flex:1}
.pill{position:relative;display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 4px;border-radius:17px;border:3px solid var(--ink);
  background:linear-gradient(#3A2A66,#231646);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 var(--ink)}
.pill canvas{width:28px;height:28px;display:block}
.pill .num{font-family:var(--en);font-size:16px;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;min-width:2.6em;text-align:right}
#mute{width:36px;height:36px;border-radius:12px;border:3px solid var(--ink);cursor:pointer;display:grid;place-items:center;background:var(--brush),var(--metal-steel);box-shadow:var(--bevel),0 3px 0 var(--ink)}
#mute svg{width:20px;height:20px}
#mute .x{display:none}#mute.off .x{display:inline}#mute.off .w{display:none}
#fail{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:18px;z-index:9;background:#0B0718}
@media (max-width:380px){ .seg button{padding:7px 8px;font-size:14px} .pill .num{font-size:15px;min-width:2.3em} .pill{padding-right:8px} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bg" class="layer"><div class="grad"></div><div class="rays r1"></div><div class="rays r2"></div><div class="rays r3"></div><div class="vig"></div></div>
    <div id="curtain" class="layer"><div class="soft"></div></div>
    <div id="beams"></div>
    <div class="layer"><div id="shadow"></div><div id="heroGlow"></div></div>
    <canvas id="fxBack" class="layer"></canvas>
    <canvas id="gl" class="layer"></canvas>
    <canvas id="fxFront" class="layer"></canvas>
    <div id="flash" class="layer"></div>
  </div>
  <div id="ui">
    <div id="title">
      <div class="title-main"></div>
      <div class="plate t0"><i class="crown"></i><span class="inl inl-rivet"></span><span class="plate-txt">普通宝箱</span><span class="inl inl-rivet"></span></div>
      <div id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
    </div>
    <div id="cards"></div>
    <div id="panel">
      <div class="p-gem"><i></i><b class="crown"></b></div>
      <div class="p-head"><span class="p-elem">火</span><div><div class="p-name">可莉</div><div class="p-sub">逃跑的太阳 · 火元素</div></div></div>
      <div class="p-stars"></div>
      <div class="p-rows"></div>
      <div class="p-power"><span>战力</span><b>0</b></div>
    </div>
    <div id="hint"><span><i class="tap"></i><em class="hint-txt" style="font-style:normal">点击宝箱</em></span></div>
    <button id="btnOpen" class="btn green"><i class="gem-l"></i>开 启<i class="gem-r"></i></button>
    <button id="btnClaim" class="btn"><i class="gem-l"></i>领 取<i class="gem-r"></i></button>
    <button id="btnAgain" class="btn green"><i class="gem-l"></i>再来一次<i class="gem-r"></i></button>
  </div>
  <div id="hud">
    <div class="seg" id="modeSeg"><button data-mode="auto" class="on">自动</button><button data-mode="manual">手动</button></div>
    <div class="spacer"></div>
    <div class="pill" id="pillCoin"><canvas></canvas><span class="num">12,580</span></div>

    varying vec2 vUv;

function resize() {

  blitMat.uniforms.srcPx.value.set(1 / rw, 1 / rh);

  else { const ps = (heroL && heroL.ps) || 1; x = (W - pw) / 2; y = Math.min(H - ph * ps - 52, b.cy + b.h / 2 + 44 * ps + 16); }
  gsap.set(elPanel, { left: x, top: y, scale: (heroL && heroL.ps) || 1 });
}
function fillPanel() {
  const ch = CHARS.fire;
  elPanel.querySelector('.p-name').textContent = ch.name; elPanel.querySelector('.p-sub').textContent = ch.sub; elPanel.querySelector('.p-elem').textContent = ch.elem;
  elPanel.querySelector('.p-stars').innerHTML = '<i class="p-star"></i>'.repeat(ch.stars);
  const rows = elPanel.querySelector('.p-rows'); rows.innerHTML = '';
  ch.stats.forEach(([l, v, u]) => { rows.insertAdjacentHTML('beforeend', `<div class="p-row"><span class="p-lbl">${l}</span><span class="p-val">0${u || ''}</span><span class="p-up">▲+${fmt(v)}${u || ''}</span></div>`); });
  elPanel.querySelector('.p-power b').textContent = '0';
}
function showPanel() {
  const ch = CHARS.fire, rows = elPanel.querySelector('.p-rows'), pw = elPanel.querySelector('.p-power b');
  placePanel();
  const ps = (heroL && heroL.ps) || 1;
  gsap.fromTo(elPanel, { opacity: 0, y: 40, scale: 0.85 * ps }, { opacity: 1, y: 0, scale: ps, duration: 0.5, ease: 'back.out(2)' });
  gsap.fromTo(elPanel.querySelectorAll('.p-star'), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(3)', stagger: 0.07, delay: 0.25, onStart: SFX.pop });
  [...rows.children].forEach((row, i) => {
    const [, v, u] = ch.stats[i], o = { v: 0 }, val = row.querySelector('.p-val'), up = row.querySelector('.p-up');
    gsap.to(o, { v, duration: 1.0, delay: 0.45 + i * 0.16, ease: 'power2.out', onUpdate: () => { val.textContent = fmt(o.v) + (u || ''); SFX.tick(); },
      onComplete: () => { gsap.fromTo(up, { opacity: 0, y: 12, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(3.5)' }); gsap.fromTo(val, { scale: 1.3 }, { scale: 1, duration: 0.5, ease: 'elastic.out(1.2,0.4)' }); SFX.pop(); } });
  });
  const po = { v: 0 };
  gsap.to(po, { v: ch.power, duration: 1.3, delay: 0.7, ease: 'power3.out', onUpdate: () => { pw.textContent = fmt(po.v); },
    onComplete: () => gsap.fromTo(pw, { scale: 1.35 }, { scale: 1, duration: 0.6, ease: 'elastic.out(1.2,0.35)' }) });
}
async function continueFromHero() {
  state = 'toCards';
  stopLoop('heroFloat'); gsap.set(HS, { float: 0 }); heroSway.rotation.set(0, 0, 0); heroSway.position.set(0, 0, 0);
  orbitStop();
  gsap.to(elHint, { opacity: 0, duration: 0.15 }); stopLoop('hintPulse'); gsap.set(elHint.firstElementChild, { scale: 1 });
  gsap.to(elPanel, { opacity: 0, y: 30, scale: 0.9, duration: 0.25, ease: 'power2.in' });
  gsap.to(elGlow, { opacity: 0, duration: 0.3 });
  gsap.to(elBg, { opacity: 1, duration: 0.5 }); gsap.to(elCurtain, { opacity: 0, duration: 0.5 });
  resultFrame(); gsap.set(C, { viewY: resultVY }); applyCamera();
  chest.visible = true; gsap.fromTo(C, { pop: 0 }, { pop: resScale(), duration: 0.55, ease: 'back.out(2.2)' });
  gsap.set(C, { lid: 1.92, glow: 0.9, idle: 0.35 });
  showBeams(0.75);
  slamTitle('LEGENDARY', '获得奖励'); gsap.to('#pips', { opacity: 1, duration: 0.3, delay: 0.3 });
  await revealCards(true);
}

/* ---------- reward cards ---------- */
let cardEls = [];
function buildCards(list) {
  elCards.innerHTML = ''; cardEls = [];
  list.forEach(r => {
    const el = document.createElement('div'); el.className = 'rcard rar-' + r.rar;
    el.innerHTML = `<div class="rc-in"><div class="rc-frame"><div class="rc-ring"></div><div class="rc-metal"><canvas></canvas></div><div class="rc-shine"></div></div></div>`;
    const inn = el.firstElementChild;
    if (r.rar === 0) [[4, 3], [85, 3], [4, 90], [85, 90]].forEach(([x, y]) => inn.insertAdjacentHTML('beforeend', `<i class="rc-rivet" style="left:${x}%;top:${y}%"></i>`));
    else if (r.rar < 3) inn.insertAdjacentHTML('beforeend', `<i class="rc-bezel silver" style="--gemc:${TIERS[r.rar].gem}"><i></i></i>`);
    else inn.insertAdjacentHTML('beforeend', `<i class="rc-bezel gold" style="--gemc:#BFF4FF"><i></i><b class="crown"></b></i>`);
    if (r.qty) inn.insertAdjacentHTML('beforeend', `<div class="rc-qty">×0</div>`);
    if (r.isNew) inn.insertAdjacentHTML('beforeend', `<div class="rc-new">NEW!</div>`);
    el._r = r; elCards.appendChild(el); cardEls.push(el);
  });
}
/* result framing: the open chest sits just above the bottom button, the card row fills the space above it */
let resultVY = TUNE.resultViewY;
const resScale = () => W / H > 1.15 ? TUNE.resultScale * 0.8 : TUNE.resultScale;
function resultFrame() {
  const save = { v: C.viewY, p: C.pop, l: C.lid, i: C.idle, s: C.squash, j: C.jump, sh: C.shake, h: C.hint };
  Object.assign(C, { viewY: TUNE.resultViewY, pop: resScale(), lid: 1.92, idle: 0, squash: 1, jump: 0, shake: 0, hint: 0 }); applyCamera(); applyRig();
  const btnTop = H - (parseFloat(getComputedStyle(btnClaim).bottom) || 72) - 60;
  const ground = toScreen(local(0, 0, BD / 2 + 0.1)).y;
  resultVY = TUNE.resultViewY + Math.min(0, (btnTop - 14 - ground) / H);
  C.viewY = resultVY; applyCamera(); applyRig();
  const box = new THREE.Box3().setFromObject(chest); let topY = 1e9;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) topY = Math.min(topY, toScreen(new THREE.Vector3(x, y, z)).y);
  Object.assign(C, { viewY: save.v, pop: save.p, lid: save.l, idle: save.i, squash: save.s, jump: save.j, shake: save.sh, hint: save.h }); applyCamera(); applyRig();
  return topY;
}
function layoutCards(n) {
  const topY = resultFrame();
  const top = titleBottomAt() + 18, avail = Math.max(110, topY - 28 - top), gap = Math.max(10, Math.min(18, W * 0.028));
  const cw = Math.floor(Math.min(128, (W - 28 - gap * (n - 1)) / n, avail / 1.4));
  elCards.style.setProperty('--cw', cw + 'px'); elCards.style.gap = gap + 'px';
  elCards.style.top = (top + Math.max(0, (avail - cw * 1.4) / 2)) + 'px';
  cardEls.forEach(el => { const cv = el.querySelector('canvas'), px = Math.round(cw * 0.86 * PR * 1.5); cv.width = px; cv.height = Math.round(px * ART_H / ART_W); drawArt(cv, el._r.kind); });
}
function landCard(el, i) {
  const inn = el.firstElementChild, r = el._r;
  SFX.pop();
  gsap.fromTo(inn, { scaleX: 1.22, scaleY: 0.8, rotation: i % 2 ? 9 : -9 }, { scaleX: 1, scaleY: 1, rotation: 0, duration: 0.9, ease: 'elastic.out(1.3,0.3)' });
  const b = el.getBoundingClientRect();
  for (let k = 0; k < Math.round(14 * PM()); k++) { const a = rand(0, TAU), s = rand(120, 320); fxFront.add({ x: b.left + b.width / 2 + Math.cos(a) * b.width * 0.45, y: b.top + b.height / 2 + Math.sin(a) * b.height * 0.45, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 3, life: rand(0.35, 0.6), size: rand(1.8, 3), color: pick([TIERS[r.rar].glow, '#fff']) }); }
  const shine = inn.querySelector('.rc-shine'); gsap.fromTo(shine, { backgroundPosition: '120% 0' }, { backgroundPosition: '-20% 0', duration: 0.8, ease: 'power2.inOut', delay: 0.1 });
  if (r.rar === 3) setLoop('rainbow', gsap.to(inn.querySelector('.rc-ring'), { rotation: 360, duration: 2.4, ease: 'none', repeat: -1 }));
  const nb = inn.querySelector('.rc-new'); if (nb) gsap.fromTo(nb, { opacity: 0, scale: 2.2, rotation: -30 }, { opacity: 1, scale: 1, rotation: 12, duration: 0.55, ease: 'back.out(3)', delay: 0.25 });
  const q = inn.querySelector('.rc-qty');
  if (q) { const o = { v: 0 }; el._qty = o; gsap.to(o, { v: r.qty, duration: 0.95, delay: 0.15, ease: 'power2.out', onUpdate: () => { q.textContent = '×' + fmt(o.v); SFX.tick(); }, onComplete: () => gsap.fromTo(q, { scale: 1.35 }, { scale: 1, duration: 0.5, ease: 'elastic.out(1.2,0.4)' }) }); }
}
function revealCards(fromHero) {
  return new Promise(async res => {
    const list = REWARDS[tier];
    buildCards(list); layoutCards(list.length);
    if (!fromHero) {
      gsap.to(C, { viewY: resultVY, pop: resScale(), duration: 0.45, ease: 'power2.inOut' });
      gsap.to(C, { idle: 0.35, duration: 0.6 });
      await wait(0.45);
    }
    const tl = gsap.timeline({ onComplete: () => res() });
    let t0 = fromHero ? 0.25 : 0;
    cardEls.forEach((el, i) => {
      if (el._r.hero && fromHero) {
        const b = el.getBoundingClientRect(), d = HERO_DEPTH(), to = screenToWorld(b.left + b.width / 2, b.top + b.height / 2, d), S = b.height * worldPerPx(d) / (CH + 0.06);
        tl.to(heroPivot.position, { x: to.x, y: to.y, z: to.z, duration: 0.55, ease: 'power3.inOut' }, 0)
          .to(heroPivot.scale, { x: S, y: S, z: S, duration: 0.55, ease: 'power3.inOut' }, 0)
          .to(heroCard.rotation, { y: Math.PI * 6, duration: 0.55, ease: 'power2.inOut' }, 0)
          .add(() => { heroPivot.visible = false; gsap.set(el, { opacity: 1 }); landCard(el, i); }, 0.55);
        return;
      }
      const m = toScreen(local(0, BT + 0.05, 0.1));
      const r = el.getBoundingClientRect(), sx = m.x - (r.left + r.width / 2), sy = m.y - (r.top + r.height / 2);
      const cx = sx * 0.4 + (i - (cardEls.length - 1) / 2) * 30, cy = Math.min(sy, 0) - 170 - rand(0, 50), rot0 = rand(160, 260) * (i % 2 ? 1 : -1), o = { u: 0 };
      tl.add(() => SFX.whoosh(), t0)
        .to(o, { u: 1, duration: 0.62, ease: 'power2.out', onStart: () => gsap.set(el, { opacity: 1 }), onUpdate: () => {
          const u = o.u, iu = 1 - u, sc = u < 0.8 ? 0.25 + (1.12 - 0.25) * (u / 0.8) : 1.12 - 0.12 * ((u - 0.8) / 0.2);
          gsap.set(el, { x: iu * iu * sx + 2 * iu * u * cx, y: iu * iu * sy + 2 * iu * u * cy, rotation: rot0 * iu * iu, scale: sc });
        } }, t0)
        .add(() => landCard(el, i), t0 + 0.62);
      t0 += 0.13;
    });
    tl.add(() => {}, '+=1.05');
  });
}

/* ---------- claim: currency flies along bezier curves into the HUD ---------- */
function hudTarget(pill) { const c = pill.querySelector('canvas').getBoundingClientRect(); return [c.left + c.width / 2, c.top + c.height / 2]; }
function bump(pill, key, add, i) {
  bal[key] += add; pill.querySelector('.num').textContent = fmt(bal[key]);
  gsap.fromTo(pill.querySelector('canvas'), { scale: 1.55 }, { scale: 1, duration: 0.45, ease: 'elastic.out(1,0.35)', overwrite: true });
  gsap.fromTo(pill.querySelector('.num'), { scale: 1.25 }, { scale: 1, duration: 0.35, ease: 'back.out(3)', overwrite: true });
  const [x, y] = hudTarget(pill); fxFront.add({ type: 'star', mode: 'none', x, y, life: 0.35, size: 14, color: key === 'coin' ? '#FFD24A' : '#FF5AA8' });
  key === 'coin' ? SFX.coin(i) : SFX.gem(i);
}
async function claim() {
  state = 'claiming'; hideButton(btnClaim);
  let tEnd = 0;
  cardEls.forEach(el => {
    const r = el._r; if (!r.qty) return;
    const key = r.kind, pill = key === 'coin' ? pillCoin : pillGem, b = el.getBoundingClientRect();
    const n = Math.max(6, Math.round((key === 'coin' ? 22 : 14) * PM())), share = r.qty / n, [tx, ty] = hudTarget(pill);
    const q = el.querySelector('.rc-qty'), o = el._qty || { v: r.qty };
    gsap.to(o, { v: 0, duration: n * 0.045 + 0.4, ease: 'none', onUpdate: () => { q.textContent = '×' + fmt(o.v); } });
    for (let i = 0; i < n; i++) {
      const x0 = b.left + b.width / 2 + rand(-b.width * 0.3, b.width * 0.3), y0 = b.top + b.height * 0.5 + rand(-b.height * 0.25, b.height * 0.25);
      const delay = i * 0.045 + (key === 'gem' ? 0.2 : 0), life = rand(0.62, 0.9);
      tEnd = Math.max(tEnd, delay + life);
      fxFront.add({ type: key, add: false, mode: 'bezier', p0: [x0, y0], p1: [x0 + rand(-160, 160), y0 - rand(90, 220)], p2: [tx + rand(-80, 40), ty + rand(90, 180)], p3: [tx, ty], ease: t => t * t * (3 - 2 * t) * 0.35 + t * t * 0.65,
        life, age: -delay, size: key === 'coin' ? 13 : 12, spin: rand(0, TAU), vs: rand(8, 14), rot: rand(-0.3, 0.3), spr: key === 'gem' ? SPR.gem : null, onDone: () => bump(pill, key, share, i) });
    }
  });
  await wait(tEnd + 0.15);
  bal.coin = Math.round(bal.coin); bal.gem = Math.round(bal.gem);
  pillCoin.querySelector('.num').textContent = fmt(bal.coin); pillGem.querySelector('.num').textContent = fmt(bal.gem);
  stopLoop('rainbow');
  gsap.to(cardEls.map(e => e.firstElementChild), { scale: 0.4, opacity: 0, y: -20, duration: 0.3, ease: 'back.in(2)', stagger: 0.05 });
  hideBeams(0.6);
  gsap.to(C, { glow: 0.35, idle: 0.35, duration: 0.6 });
  await wait(0.45);
  state = 'done';
  popButton(btnAgain);
  elHintTxt.textContent = '奖励已入账'; gsap.to(elHint, { opacity: 1, duration: 0.3 });
}
async function replay() {
  state = 'resetting'; hideButton(btnAgain); gsap.to(elHint, { opacity: 0, duration: 0.15 });
  elCards.innerHTML = ''; cardEls = [];
  const tl = gsap.timeline();
  tl.to(C, { lid: 0, duration: 0.5, ease: 'bounce.out' }, 0).to(C, { glow: 0, duration: 0.4 }, 0)
    .to(C, { viewY: TUNE.idleViewY, pop: 1, duration: 0.55, ease: 'back.out(1.6)' }, 0.1)
    .add(() => { tier = 0; paintTier(0, 0.4); slamTitle(TIERS[0].en, TIERS[0].zh); SFX.land(); }, 0.35);
  await wait(0.9);
  startIdle();
}

/* ---------- flows ---------- */
async function upgradeOnce() { state = 'upgrading'; stopIdle(); await hop(tier + 1); startIdle(); }
async function openSeq() {
  state = 'charging'; stopIdle();
  await charge();
  state = 'burst';
  await burst();
  if (tier === 3) {
    await heroReveal();
    state = 'hero';
    elHintTxt.textContent = '点击继续'; gsap.to(elHint, { opacity: 1, duration: 0.3 });
    setLoop('hintPulse', gsap.fromTo(elHint.firstElementChild, { scale: 1 }, { scale: 1.08, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: -1 }));
  } else {
    state = 'cardsIn';
    slamTitle(TIERS[tier].en, '获得奖励');
    await revealCards(false);
    toClaim();
  }
}
function toClaim() { state = 'claim'; popButton(btnClaim); }
async function runAuto() { state = 'auto'; stopIdle(); while (tier < 3) { await hop(tier + 1); await wait(0.1); } await openSeq(); }

function onTap() {
  audioInit();
  if (state === 'idle') { if (mode === 'auto') runAuto(); else if (tier < 3) upgradeOnce(); else openSeq(); }
  else if (state === 'hero') continueFromHero().then(toClaim);
  else if (state === 'done') replay();
}
elApp.addEventListener('pointerdown', audioInit, { passive: true });
elApp.addEventListener('click', e => { if (e.target.closest('button,#hud')) return; onTap(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(); } });
btnOpen.addEventListener('click', e => { e.stopPropagation(); audioInit(); if (state === 'idle') openSeq(); });
btnClaim.addEventListener('click', e => { e.stopPropagation(); audioInit(); if (state === 'claim') claim(); });
btnAgain.addEventListener('click', e => { e.stopPropagation(); audioInit(); if (state === 'done') replay(); });
elSeg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || state !== 'idle') return;
  mode = b.dataset.mode; elSeg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  gsap.fromTo(b, { scale: 0.85 }, { scale: 1, duration: 0.4, ease: 'back.out(3)' });
  startIdle();
});
elMute.addEventListener('click', e => {
  e.stopPropagation(); audioInit(); AU.muted = !AU.muted; elMute.classList.toggle('off', AU.muted);
  if (AU.out) AU.out.gain.setTargetAtTime(AU.muted ? 0 : 0.85, AU.ctx.currentTime, 0.02);
});

/* ---------- HUD icons ---------- */
function drawHudIcons() {
  if (!SPR.coin) return;
  [[pillCoin, SPR.coin], [pillGem, SPR.gem]].forEach(([p, s]) => { const cv = p.querySelector('canvas'), px = Math.round(28 * PR * 1.5); cv.width = cv.height = px; const c = cv.getContext('2d'); c.clearRect(0, 0, px, px); c.drawImage(s, 0, 0, px, px); });
}

/* ---------- main loop ---------- */
let last = performance.now();
const VT = +qs.get('vt') || 0; let vclock = 0;
if (VT) { gsap.ticker.remove(gsap.updateRoot); gsap.ticker.lagSmoothing(0); }
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (VT) { dt = VT; vclock += VT; gsap.updateRoot(vclock); }
  T += dt;
  applyCamera(); applyRig();
  const Tt = TIERS[tier];
  // seam light: dark recess -> tier glow -> white-hot while charging; capped once the lid is open
  const g = C.glow, open = Math.min(1, C.lid / 1.2);
  _cg.copy(CORE_DARK).lerp(new THREE.Color(Tt.glow), Math.min(1, g));
  if (g > 0.35) _cg.lerp(WHITE, Math.min(0.8, (g - 0.35) * 0.9) * (1 - open * 0.7));
  MAT.core.color.copy(_cg);
  MAT.lidCore.color.copy(_cg).lerp(LID_IN, open);
  if (heroPivot.visible) {
    heroPivot.quaternion.copy(camera.quaternion);
    heroSway.position.y = Math.sin(T * 1.8) * 0.05 * HS.float;
    heroSway.rotation.y = Math.sin(T * 0.9) * 0.22 * HS.float;
  }
  updateAnchors();
  renderScene();
  fxBack.update(dt); fxFront.update(dt); fxBack.draw(); fxFront.draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
buildSprites();
heroFront.material.map = cardTex('fire'); heroBack.material.map = cardTex('back');
heroFront.material.needsUpdate = heroBack.material.needsUpdate = true;
renderer.initTexture(heroFront.material.map); renderer.initTexture(heroBack.material.map);
paintTier(0, 0);
resize();
addEventListener('resize', resize);
gsap.to('.rays.r1', { rotation: 360, duration: 70, ease: 'none', repeat: -1 });
gsap.to('.rays.r2', { rotation: -360, duration: 110, ease: 'none', repeat: -1 });
gsap.to('.rays.r3', { rotation: 360, duration: 160, ease: 'none', repeat: -1 });
gsap.to('#curtain .soft', { rotation: 360, duration: 40, ease: 'none', repeat: -1 });
elTitleMain.textContent = TIERS[0].en;
requestAnimationFrame(frame);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { slamTitle(TIERS[0].en, TIERS[0].zh); startIdle(); drawHudIcons(); });

window.__hl = { get state() { return state; }, get tier() { return tier; }, get vclock() { return vclock; }, C, TUNE, drawArt, mk };
</script>
