<style>

  canvas{width:min(100vw,100vh);height:auto;max-height:100vh}

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
// 第 48 届世界技能大赛 · 上海 2026：一段每一帧都由代码绘制的短片。
// 约定（render.mjs 依赖）：draw(frame) 是帧号的纯函数；不用 Math.random / Date。
const W = 1080, H = 1080, FPS = 30;
const BPM = 96, BEAT = 60 / BPM, b = n => n * BEAT;       // b(8) = 第 8 拍（秒）
const DUR = b(100), FRAMES = Math.round(DUR * FPS);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// LOOK（为这部片子选的，每一项都有理由）
//   风格：电影感的平涂 + 光点粒子。理由：主题是“手艺”和“火花”，暗场里的熔金光最像焊花与奖牌。
//   色板：夜钢蓝 NIGHT 打底，熔金 MOLTEN 为主色，电弧蓝 ARC 与金 GOLD 做辅；园林一场换成宣纸与水墨。
//   线条：无描边，靠明暗；吉祥物单独用深色描边，保证孩子一眼认出。
//   字体：标题用思源宋体 Black（庄重、有“匠”气），说明文字用思源黑体。
//   节奏：解说片节奏，每个镜头 5 秒左右，一个镜头只讲一件事。
//   声音：groove 模板，percussion 音色（马林巴、木鱼、低音鼓：木头的声音对应“手艺”），folk 和声，96 BPM。
const NIGHT = '#0d1424', NIGHT2 = '#16213a', MOLTEN = '#ffb23f', ARC = '#9fd8ff', GOLD = '#ffd66b', CREAM = '#fff1d6', MUTED = '#9aa8c2';
const SERIF = '"Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif';
const SANS = '"Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
const TAU = Math.PI * 2;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);

const prog = (t, a, b) => clamp((t - a) / (b - a));

// ---------- one world, many cameras ----------
function withCamera(cam, fn) { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.k, cam.k); ctx.translate(-cam.cx, -cam.cy); fn(); ctx.restore(); }
let LAYOUT = [];
function claim(id, kind, x, y, w, h) {
  const m = ctx.getTransform(), P = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, c]) => [m.a * a + m.c * c + m.e, m.b * a + m.d * c + m.f]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]); LAYOUT.push({ id, kind, x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
}

// ---------- storyboard: the single source of truth ----------
const SHOTS = [
  { id: 'title',    from: 0,      to: b(8)  },  // 一点电弧迸出 1385 个光点，拼成“48”
  { id: 'madrid',   from: b(8),   to: b(16) },  // 光点散开，只剩 24 个：1950 年马德里
  { id: 'shanghai', from: b(16),  to: b(28) },  // 24 个分裂成 1385 个，长成“四叶草”
  { id: 'hive',     from: b(28),  to: b(36) },  // 四叶草变成 64 个六边形，7 个新项目亮起；推进“焊接”
  { id: 'weld',     from: b(36),  to: b(44) },  // 焊接特写：电弧、焊缝、火花、面罩视角
  { id: 'drone',    from: b(44),  to: b(52) },  // 火花向右 → 无人机向右飞过黄浦江，穿 3 个圈；推进夕阳
  { id: 'garden',   from: b(52),  to: b(60) },  // 夕阳 = 月洞门；拉出、平移、推进门洞
  { id: 'mascots',  from: b(60),  to: b(68) },  // 能能、巧巧跳进画面；“能工巧匠”
  { id: 'china',    from: b(68),  to: b(76) },  // 大拇指上的光点飞出，拼成“93”
  { id: 'medal',    from: b(76),  to: b(88) },  // 93 → 奖牌轮廓；三块榫卯木件咬合；静音一小节后变成金牌
  { id: 'finale',   from: b(88),  to: DUR   },  // 金牌化作光点，拼出标语
];
const SECTIONS = [                                   // bars (4 beats = 2.5 s) → music layers
  [0, 1, ['padSoft']],
  [1, 2, ['padSoft', 'pluck']],
  [2, 4, ['pad', 'pluck', 'kick2']],
  [4, 7, ['pad', 'pluck', 'kick2', 'hat8']],
  [7, 8, ['pad', 'pluck', 'kick2', 'hat8', 'bassHalf']],
  [8, 9, ['pad', 'pluck', 'kick4', 'hat8', 'bassHalf']],
  [9, 11, ['pad', 'kick4', 'hat8', 'clap', 'bass8']],
  [11, 13, ['pad', 'kick4', 'hat16', 'clap', 'bass8', 'lead']],
  [13, 15, ['padSoft', 'pluck', 'kick2', 'bassHalf']],
  [15, 16, ['pad', 'pluck', 'kick2', 'hat8', 'bassHalf']],
  [16, 17, ['pad', 'pluck', 'kick4', 'hat8', 'clap', 'bass8']],
  [17, 19, ['pad', 'kick4', 'hat16', 'clap', 'bass8', 'lead']],
  [19, 20, ['pad', 'kick2', 'bassHalf']],
  [20, 21, []],                                      // break：榫卯咬合只剩木头声
  [21, 22, ['pad', 'crash', 'kick4', 'hat8', 'bass8', 'lead']],
  [22, 25, ['pad', 'pluck', 'kick2', 'bassHalf']],
];
const NEW_ORDER = [22, 5, 38, 12, 45, 27, 58];         // 7 个新项目格子点亮的顺序
const PUSH_CELL = 36;                                  // 镜头推进的格子：焊接
const RINGS = [{ tp: 1.25, y: 430 }, { tp: 2.5, y: 600 }, { tp: 3.75, y: 400 }];   // 无人机穿圈（镜头内时间）
const EVENTS = [
  [b(1), 'crackle'], [b(3), 'whooshIn'], [b(4.5), 'ding'],
  [b(8), 'whoosh'], [b(9), 'popLow', 0], [b(10), 'popLow', 1], [b(11), 'popLow', 2], [b(12), 'popLow', 3],
  [b(16), 'whooshOut'], ...[17, 18, 19, 20, 21, 22, 23].map(n => [b(n), 'tick']), [b(24), 'ding'],
  [b(28), 'whoosh'], ...NEW_ORDER.map((_, k) => [b(30 + k * .5), 'popLow', k]), [b(34), 'whooshIn'],
  [b(36.5), 'clank'], [b(37), 'crackle'], [b(38.5), 'crackle'], [b(40), 'crackle'], [b(41.5), 'crackle'],
  [b(44), 'swish'], ...RINGS.map(r => [b(44) + r.tp, 'zip', 3]), [b(50.7), 'whooshIn'],
  [b(52), 'drip'], [b(57.8), 'whooshIn'],
  [b(60), 'boing'], [b(61), 'boing'], [b(62), 'pop'], [b(64), 'ding'], [b(67), 'notify'],
  [b(68), 'whoosh'], [b(70), 'tick'], [b(71.5), 'tick'], [b(73), 'tick'], [b(74), 'ding'],
  [b(76), 'swish'], [b(77.5), 'swish'], [b(81), 'clonk'], [b(82), 'clonk'], [b(83), 'clonk'], [b(84), 'flag'],
  [b(88), 'whooshOut'], [b(92), 'ding'],
];
window.CUES = [...SHOTS.slice(1).map(s => s.from), b(84)];

// ---------- 奖牌几何：不规则六边形 + 三条燕尾榫 ----------
const MEDAL = (() => {
  const V = [[-.9, -.3], [-.3, -.92], [.55, -.8], [.95, .08], [.47, .88], [-.62, .74]], C0 = [.02, .02];
  const dovetail = (C, E, side) => { const dx = E[0] - C[0], dy = E[1] - C[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy * side, ny = ux * side;
    const at = (t, o) => [C[0] + ux * L * t + nx * o, C[1] + uy * L * t + ny * o]; return [C, at(.47, 0), at(.4, .15), at(.68, .15), at(.6, 0), E]; };
  const E = [V[0], V[2], V[4]], cuts = [dovetail(C0, E[0], 1), dovetail(C0, E[1], -1), dovetail(C0, E[2], 1)];
  const pieces = [0, 1, 2].map(i => { const j = (i + 1) % 3, out = [V[2 * i], V[2 * i + 1]]; out.push(...cuts[j].slice().reverse()); out.push(...cuts[i].slice(1, -1)); return out; });
  return { V, cuts, pieces };
})();
const MC = [540, 460], MR = 300;                          // 奖牌在画面中的中心与半径
const mpt = ([x, y], o = [0, 0]) => [MC[0] + x * MR + o[0], MC[1] + y * MR + o[1]];

// ---------- 粒子：1385 个光点，每个代表一名选手 ----------
const N = 1385;
const COL = { molten: [255, 178, 63], white: [255, 238, 210], arc: [140, 196, 255], steel: [96, 116, 160], es: [255, 124, 88], pt: [77, 224, 168], gold: [255, 214, 107], dim: [170, 130, 70] };
let F = null, P = null, HIVE = null;
function samplePath(pts, n, closed, r) {
  const segs = [], L = []; let tot = 0; const m = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < m; i++) { const a = pts[i], c = pts[(i + 1) % pts.length], l = Math.hypot(c[0] - a[0], c[1] - a[1]); segs.push([a, c, l]); tot += l; L.push(tot); }
  const out = []; for (let k = 0; k < n; k++) { const d = (k + r() * .5) / n * tot; let i = 0; while (i < L.length - 1 && L[i] < d) i++; const [a, c, l] = segs[i], t = (d - (L[i] - l)) / (l || 1); out.push([lerp(a[0], c[0], t), lerp(a[1], c[1], t)]); }
  return out;
}
function sampleText(lines, n, seed) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; lines.forEach(L => { x.font = L.font; x.fillText(L.txt, L.x, L.y); });
  const d = x.getImageData(0, 0, W, H).data, A = (X, Y) => (X < 0 || Y < 0 || X >= W || Y >= H) ? 0 : d[(Y * W + X) * 4 + 3], pts = [], edge = [];
  for (let y = 0; y < H; y += 3) for (let X = 0; X < W; X += 3) if (A(X, y) > 128) { pts.push([X, y]); if (A(X + 6, y) < 128 || A(X - 6, y) < 128 || A(X, y + 6) < 128 || A(X, y - 6) < 128) edge.push([X, y]); }
  const r = rng(seed), out = [];
  for (let i = 0; i < n; i++) { const e = i % 3 === 0 && edge.length > 0, src = e ? edge : pts, q = src[Math.floor(r() * src.length)] || [540, 540]; out.push({ x: q[0] + (r() - .5) * 2.5, y: q[1] + (r() - .5) * 2.5, e }); }
  return out;
}
function build() {
  const r = rng(11);
  P = []; for (let i = 0; i < N; i++) P.push({ r1: r(), r2: r(), r3: r(), r4: r(), ph: r() * TAU, dx: r() * W, dy: r() * H, s: 2.2 + r() * 2 });
  F = {};
  F.t48 = sampleText([{ txt: '48', x: 540, y: 430, font: `900 600px ${SANS}` }], N, 3).map(p => ({ x: p.x, y: p.y, c: p.e ? 'white' : 'molten', a: p.e ? 1 : .8 }));
  F.mad = P.map((p, i) => i < 24 ? { x: 250 + (i % 12) * (580 / 11), y: i < 12 ? 470 : 610, c: i < 12 ? 'es' : 'pt', a: 1 } : { x: p.dx, y: p.dy, c: 'steel', a: .07 });
  // 四叶草：四个圆 + 中心广场
  const CIR = [[-.46, -.46, .5], [.46, -.46, .5], [-.46, .46, .5], [.46, .46, .5], [0, 0, .4]], S = 320, CX = 540, CY = 450;
  const inside = (x, y, skip = -1) => CIR.some(([a, c, rad], i) => i !== skip && (x - a) ** 2 + (y - c) ** 2 < rad * rad);
  F.clo = [];
  while (F.clo.length < N) {
    if (F.clo.length < N * .38) { const i = Math.floor(r() * 4), [a, c, rad] = CIR[i], t = r() * TAU, x = a + Math.cos(t) * rad, y = c + Math.sin(t) * rad; if (!inside(x, y, i)) F.clo.push({ x: CX + x * S, y: CY + y * S, c: 'white', a: .95 }); }
    else { const x = (r() - .5) * 2, y = (r() - .5) * 2; if (inside(x, y)) { const cen = Math.hypot(x, y) < .16; F.clo.push({ x: CX + x * S, y: CY + y * S, c: cen ? 'gold' : 'molten', a: cen ? .95 : .55 }); } }
  }
  for (let i = F.clo.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [F.clo[i], F.clo[j]] = [F.clo[j], F.clo[i]]; }
  // 64 个六边形
  const rad = 700 / (8.5 * Math.sqrt(3)), hw = Math.sqrt(3) * rad, cells = [];
  for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) cells.push([(col + (row % 2 ? .5 : 0)) * hw, row * 1.5 * rad]);
  const mx = 7.5 * hw / 2, my = 7 * 1.5 * rad / 2, HX = 540, HY = 490;
  HIVE = { rad, cells: cells.map(([x, y]) => [HX + x - mx, HY + y - my]) };
  const hexPts = ([cx, cy], s = .9) => [0, 1, 2, 3, 4, 5].map(k => [cx + Math.cos(Math.PI / 6 + k * Math.PI / 3) * rad * s, cy + Math.sin(Math.PI / 6 + k * Math.PI / 3) * rad * s]);
  HIVE.hex = hexPts;
  F.hive = []; const per = Math.floor(N / 64);
  HIVE.cells.forEach((c, idx) => samplePath(hexPts(c), per, true, r).forEach(([x, y]) => F.hive.push({ x, y, cell: idx })));
  while (F.hive.length < N) { const idx = NEW_ORDER[F.hive.length % 7], [x, y] = samplePath(hexPts(HIVE.cells[idx]), 1, true, r)[0]; F.hive.push({ x, y, cell: idx }); }
  for (let i = F.hive.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [F.hive[i], F.hive[j]] = [F.hive[j], F.hive[i]]; }
  F.t93 = sampleText([{ txt: '93', x: 540, y: 370, font: `900 480px ${SANS}` }], N, 4).map(p => ({ x: p.x, y: p.y, c: p.e ? 'white' : 'gold', a: p.e ? 1 : .8 }));
  F.med = [];
  samplePath(MEDAL.V, Math.floor(N * .5), true, r).forEach(p => F.med.push({ ...xy(mpt(p)), c: 'gold', a: 1 }));
  MEDAL.cuts.forEach(cut => samplePath(cut, Math.floor(N * .08), false, r).forEach(p => F.med.push({ ...xy(mpt(p)), c: 'white', a: .95 })));
  while (F.med.length < N) { const x = (r() - .5) * 2, y = (r() - .5) * 2; if (inPoly(x, y, MEDAL.V)) F.med.push({ ...xy(mpt([x, y])), c: 'dim', a: .25 }); }
  for (let i = F.med.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [F.med[i], F.med[j]] = [F.med[j], F.med[i]]; }
  F.slo = sampleText([{ txt: '技能改变世界', x: 540, y: 420, font: `900 128px ${SERIF}` }, { txt: '技能照亮前程', x: 540, y: 580, font: `900 128px ${SERIF}` }], N, 6).map(p => ({ x: p.x, y: p.y, c: p.e ? 'white' : 'gold', a: 1 }));
  buildTextures();
}
const xy = ([x, y]) => ({ x, y });
function uOf(t, t0, t1, p, spread = .3) { const d = (t1 - t0) * spread * p.r1; return clamp((t - t0 - d) / ((t1 - t0) * (1 - spread))); }
function morph(A, B, u, p, amp = 1) {

  const arc = Math.sin(u * Math.PI) * (p.r2 - .5) * Math.min(300, L * .6) * amp; return { x: x - dy / L * arc, y: y + dx / L * arc };
}
const mixC = (a, b, u) => [lerp(COL[a][0], COL[b][0], u), lerp(COL[a][1], COL[b][1], u), lerp(COL[a][2], COL[b][2], u)];
const IGNITE = [540, 430], THUMB = [830, 672];
function madPos(i, t) { const p = P[i]; return morph(F.t48[i], F.mad[i], uOf(t, b(8), b(9.6), p), p); }

function birth(i) { const q = (i - 24) / (N - 24); return b(16.5) + (b(23.5) - b(16.5)) * Math.sqrt(q); }
function particle(i, t) {
  const p = P[i]; let pos, a, col, s = p.s, halo = 0;
  if (t < b(3)) return null;
  if (t < b(8)) {
    const u = clamp((t - b(3) - p.r1 * .35) / 1.5); if (u <= 0) return null;
    const T = F.t48[i], e = easeOut(u), ang = p.r2 * TAU, bd = (200 + p.r3 * 380) * Math.sin(u * Math.PI) * (1 - e * .4);
    pos = { x: lerp(IGNITE[0], T.x, e) + Math.cos(ang) * bd, y: lerp(IGNITE[1], T.y, e) + Math.sin(ang) * bd }; a = lerp(1, T.a, e); col = mixC('white', T.c, e);
  } else if (t < b(16)) {
    const u = uOf(t, b(8), b(9.6), p), A = F.t48[i], B = F.mad[i]; pos = madPos(i, t); col = mixC(A.c, B.c, ease(u)); a = lerp(A.a, B.a, ease(u));

    if (i < 24) { pos = cloOrigin(i, t); const u = prog(t, b(16), b(18)); col = mixC(F.mad[i].c, F.clo[i].c, u); a = lerp(1, F.clo[i].a, u); s = p.s * lerp(2.2, 1, u); halo = .22 * (1 - u); }
    else { const tb = birth(i); if (t < tb) return null; const par = cloOrigin(i % 24, tb), v = clamp((t - tb) / .9); pos = morph(par, F.clo[i], v, p, .5); col = mixC('white', F.clo[i].c, v); a = F.clo[i].a; }
  } else if (t < b(36)) {
    const u = uOf(t, b(28), b(29.6), p), B = F.hive[i], k = NEW_ORDER.indexOf(B.cell); pos = morph(F.clo[i], B, u, p);
    let c2 = 'arc', a2 = .55; if (k >= 0 && t >= b(30 + k * .5)) { c2 = 'gold'; a2 = 1; const dt = t - b(30 + k * .5); s = p.s * (1 + 1.4 * Math.exp(-dt * 5)); }

    whoosh: t => hiss(X, t, 'bandpass', 500, 1, .22, .15, .15, 2500, .3),
    boing: t => { osc(X, t, 'sine', 520, .3, .005, .18, 180, .25); osc(X, t + .02, 'sine', 260, .15, .005, .12); },
    clank: t => { osc(X, t, 'triangle', 880, .22, .001, .06); osc(X, t, 'triangle', 1318, .12, .001, .05); hiss(X, t, 'bandpass', 4000, 3, .15, .001, .02); },
    ding: t => { osc(X, t, 'sine', 1568, .22, .002, .35); osc(X, t, 'sine', 2349, .08, .002, .2); },
    pop: t => osc(X, t, 'sine', 500, .28, .002, .06, 900, .05), popLow: (t, i = 0) => osc(X, t, 'sine', 220 + i * 40, .3, .002, .08, 420 + i * 60, .06, i % 2 ? .4 : -.4),
    tick: t => { hiss(X, t, 'bandpass', 2600, 4, .22, .001, .02); osc(X, t, 'triangle', 620, .12, .001, .03, 300, .04); },
    swish: t => hiss(X, t, 'bandpass', 1200, 2, .18, .03, .08, 2500, .12), thud: t => { osc(X, t, 'sine', 110, .5, .002, .12, 40, .12); hiss(X, t, 'lowpass', 400, 1, .2, .002, .06); },
    clonk: t => { osc(X, t, 'triangle', 330, .25, .001, .07); osc(X, t, 'triangle', 495, .12, .001, .05); },
    creak: t => osc(X, t, 'sawtooth', 90, .05, .02, .12, 70, .2),
    blip: (t, i = 0) => osc(X, t, 'square', 880 + i * 110, .06, .002, .04, null, 0, (i - 2.5) * .15),
    zip: (t, i = 0) => osc(X, t, 'sawtooth', 200 + i * 45, .06, .004, .08, 700 + i * 90, .12, i % 2 ? .3 : -.3),
    flag: t => { hiss(X, t, 'bandpass', 1800, 1.5, .2, .01, .06); osc(X, t + .05, 'sine', 1319, .2, .002, .3); osc(X, t + .12, 'sine', 1760, .2, .002, .4); },
    alarm: t => { osc(X, t, 'square', 1760, .07, .002, .05); osc(X, t + .12, 'square', 1760, .07, .002, .05); },
    step: t => { osc(X, t, 'sine', 140, .12, .002, .04, 90, .04); hiss(X, t, 'lowpass', 800, 1, .05, .002, .02); },
    notify: t => { osc(X, t, 'sine', 1319, .25, .002, .25); osc(X, t + .1, 'sine', 1976, .22, .002, .35); },
    drip: t => osc(X, t, 'sine', 1400, .18, .002, .08, 700, .08),
    // 焊花噼啪：一串短促的高频噪声，间隔由种子决定（每次渲染都一样）
    crackle: t => { let s = Math.round(t * 1000) | 1; for (let k = 0; k < 14; k++) { s = (s * 1103515245 + 12345) & 0x7fffffff; const dt = k * .045 + (s / 0x7fffffff) * .03; hiss(X, t + dt, 'bandpass', 2500 + (s % 2500), 1.5, .07 + (s % 7) * .012, .001, .012, null, 0, ((s % 9) - 4) * .08); } },
  };
  for (const [t, name, arg] of events) { if (!FX[name]) throw new Error(`groove: unknown sfx "${name}"`); FX[name](T0 + t, arg); }
  master.gain.setValueAtTime(gain, T0 + dur - 1); master.gain.linearRampToValueAtTime(0, T0 + dur);
}
window.SCORE = ac => buildGroove(ac, { dur: DUR, bpm: BPM, sections: SECTIONS, events: EVENTS, kit: 'percussion', harmony: 'folk', sfxGain: .8 });

// live preview when opened directly in a browser (render.mjs loads the page with ?render)
if (!new URLSearchParams(location.search).has('render')) {
  let start = performance.now();
  const loop = () => { draw(Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); };
  loop();
  addEventListener('click', () => { if (!window.SCORE) return; const ac = new AudioContext(); window.SCORE(ac); start = performance.now() + 50; }, { once: true });
}
</script>
