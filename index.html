    } else if ('BroadcastChannel' in window) {
      const hub = localHub(); N.kind = 'local'; N.lobby = hub.lobby; N.join = async name => ({ room: await hub.join(name), inLobby: false }); N.myId = () => hub.id;
    }
    N.status = N.kind ? 'ok' : 'none';
    return N;
  })());

}

.jb-ui .cmd.pri em{color:#0a0612}
.jb-ui .cmd b{font-size:20px;font-weight:800;letter-spacing:.14em;transform:skewX(-9deg)}
.jb-ui .cmd .end{margin-left:auto;display:flex;align-items:center;gap:6px}
/* the boot screen */
.jb-ui .title{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto auto;gap:12px}
.jb-ui .strip{display:flex;align-items:center;gap:10px;min-height:30px;padding-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;min-width:0}
.jb-ui .strip b{color:var(--tx);font-weight:600}
.jb-ui .strip .ok{color:var(--cy)}
.jb-ui .strip .k{margin-left:6px}
.jb-ui .led{width:7px;height:7px;flex:none;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:jBlink 1.3s steps(2) infinite}
.jb-ui .led.mg{background:var(--mg);box-shadow:0 0 8px var(--mg)}.jb-ui .led.rd{background:var(--rd);box-shadow:0 0 8px var(--rd)}
.jb-ui .hero{align-self:end;display:flex;flex-direction:column;gap:12px;min-width:0}
.jb-ui .log{font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--cy)}
.jb-ui .log p{white-space:nowrap;overflow:hidden;width:0;animation:jType .7s steps(30) forwards;animation-delay:calc(.35s + var(--j) * .42s)}
.jb-ui .log p b{color:var(--yl);font-weight:500}.jb-ui .log p i{font-style:normal;color:var(--faint)}
@keyframes jType{to{width:40ch}}
.jb-ui .ttl{position:relative;padding-top:.2em}
.jb-ui .ghost{position:absolute;left:-.04em;top:-.1em;font-family:var(--cond);font-weight:700;font-size:clamp(46px,min(16vh,15vw),150px);line-height:.85;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1px rgba(255,43,214,.6);white-space:nowrap;pointer-events:none;opacity:.8}
.jb-ui .h1{position:relative;font-weight:800;font-size:clamp(56px,min(15vh,17vw),130px);line-height:1.02;letter-spacing:.05em;transform:skewX(-10deg);transform-origin:0 100%;color:#f4fbff}
.jb-ui .sub{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.jb-ui .tag{background:var(--mg);color:#0a0612;padding:1px 7px;font-weight:700;letter-spacing:.1em}
.jb-ui .tip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--yl);border:1px dashed rgba(243,255,0,.5);padding:3px 8px;align-self:flex-start}
.jb-ui .deck{align-self:end;display:flex;flex-direction:column;gap:10px;min-width:0}
.jb-ui .hi{display:flex;align-items:center;gap:14px;padding:6px 12px;border-left:2px solid var(--mg);background:linear-gradient(90deg,rgba(255,43,214,.18),transparent 80%)}
.jb-ui .hi small{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--mg)}
.jb-ui .hi b{font-family:var(--cond);font-size:28px;font-weight:700;letter-spacing:.1em;line-height:1;text-shadow:0 0 14px rgba(0,240,255,.45)}
.jb-ui .hi b i,.jb-ui .rd b i{font-style:normal;opacity:.22}
.jb-ui .sws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.jb-ui .sw{pointer-events:auto;appearance:none;border:1px solid var(--line);background:rgba(7,3,18,.62);font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:7px 9px;text-align:left;min-width:0;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.jb-ui .sw small{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--cy)}
.jb-ui .sw span{display:flex;gap:3px}
.jb-ui .sw em{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 5px;color:var(--faint);white-space:nowrap}
.jb-ui .sw em.on{color:#0a0612;background:var(--cy);box-shadow:0 0 10px rgba(0,240,255,.6)}
.jb-ui .sw.press{border-color:var(--yl)}
.jb-ui .ticker{height:24px;overflow:hidden;border-top:1px solid var(--line);display:flex;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);min-width:0}
.jb-ui .ticker>div{display:flex;gap:48px;white-space:nowrap;animation:jTick 32s linear infinite}
.jb-ui .ticker b{color:var(--mg);font-weight:500}
@keyframes jTick{to{transform:translateX(-50%)}}
.jb-ui .boot{display:flex;flex-direction:column;gap:8px}
.jb-ui .pbar{display:flex;gap:3px;height:12px}.jb-ui .pbar i{flex:1;background:rgba(0,240,255,.12)}.jb-ui .pbar i.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}
/* the network screens */
.jb-ui .net{display:flex;flex-direction:column;gap:14px}
.jb-ui .bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.jb-ui .bar .h small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mg)}
.jb-ui .bar .h b{display:block;font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.08em;line-height:1.05;text-transform:uppercase}
.jb-ui .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;overflow:auto;scrollbar-width:none;touch-action:pan-y;align-content:start}
.jb-ui .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.jb-ui .chans{display:flex;flex-direction:column;gap:8px}
.jb-ui .chan{pointer-events:auto;appearance:none;border:0;font:inherit;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;text-align:left;background:linear-gradient(90deg,rgba(0,240,255,.14),rgba(7,3,18,.6));border-left:2px solid var(--cy);-webkit-tap-highlight-color:transparent;transition:transform .12s,background .12s}
.jb-ui .chan:hover{background:linear-gradient(90deg,rgba(0,240,255,.24),rgba(7,3,18,.6))}
.jb-ui .chan.press{transform:translateX(4px)}
.jb-ui .chan .code{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.08em}
.jb-ui .md{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;padding:2px 6px;color:#0a0612;background:var(--cy)}
.jb-ui .md.vs{background:var(--mg)}
.jb-ui .chan .lv{font-family:var(--mono);font-size:11px;color:var(--faint)}
.jb-ui .slots{display:flex;gap:3px;margin-left:auto}.jb-ui .slots i{width:5px;height:14px;background:rgba(0,240,255,.18)}.jb-ui .slots i.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.jb-ui .chan .go{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--yl);letter-spacing:.14em}
.jb-ui .radar{position:relative;width:118px;height:118px;margin:4px auto 0;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,transparent 29%,rgba(0,240,255,.25) 30%,transparent 31%,transparent 62%,rgba(0,240,255,.2) 63%,transparent 64%)}
.jb-ui .radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,240,255,.6),transparent 24%);animation:jSpin 2.2s linear infinite}
.jb-ui .radar::after{content:"";position:absolute;left:50%;top:6%;bottom:6%;width:1px;background:rgba(0,240,255,.25)}
.jb-ui .radar i{position:absolute;width:4px;height:4px;background:var(--mg);box-shadow:0 0 8px var(--mg);animation:jBlink 1.7s steps(2) infinite}
.jb-ui .scan{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim)}
.jb-ui .squad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jb-ui .slot{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 12px;min-height:66px;background:linear-gradient(135deg,rgba(0,240,255,.12),rgba(7,3,18,.72));border-left:3px solid var(--c);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.jb-ui .slot .no{position:absolute;right:10px;top:8px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.jb-ui .slot b{font-size:17px;font-weight:800;letter-spacing:.14em;transform:skewX(-8deg);transform-origin:0 50%}
.jb-ui .slot small{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--c)}
.jb-ui .slot .st{position:absolute;right:12px;bottom:10px;font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;padding:1px 5px;color:#0a0612;background:var(--c)}
.jb-ui .slot.empty{border-left:3px dashed rgba(205,228,255,.3);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px)}
.jb-ui .slot.empty b{color:var(--faint);font-weight:500}
.jb-ui .chcode{display:flex;align-items:baseline;gap:12px;font-family:var(--cond);font-weight:700}
.jb-ui .chcode small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mg);font-weight:500}
.jb-ui .tabs{pointer-events:auto;display:flex;border:1px solid var(--line)}
.jb-ui .tabs button{pointer-events:auto;appearance:none;border:0;font:inherit;background:none;color:var(--dim);display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;font-size:12.5px;font-weight:700;letter-spacing:.1em;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.jb-ui .tabs button small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em}
.jb-ui .tabs button.on{color:#0a0612;background:var(--cy);box-shadow:0 0 14px rgba(0,240,255,.5)}
.jb-ui .tabs button.on.vs{background:var(--mg);box-shadow:0 0 14px rgba(255,43,214,.5)}
.jb-ui .mdesc{position:relative;padding:12px 14px 12px 20px;background:rgba(7,3,18,.6);font-size:12.5px;line-height:1.75;color:var(--dim)}
.jb-ui .mdesc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(-45deg,var(--yl) 0 5px,#0a0612 5px 10px)}
.jb-ui .mdesc b{display:block;font-family:var(--cond);font-size:19px;letter-spacing:.1em;color:var(--tx);margin-bottom:4px}
.jb-ui .medal{display:flex;flex-direction:column;align-items:center;gap:5px}
.jb-ui .medal b{font-size:15px;letter-spacing:.3em;color:var(--dim)}
.jb-ui .medal.m1 b{color:#e0a36b}.jb-ui .medal.m2 b{color:#dfe8f2}.jb-ui .medal.m3 b{color:var(--yl);text-shadow:0 0 14px rgba(243,255,0,.6)}
.jb-ui .medal b em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#0a0612;background:var(--mg);padding:1px 5px;vertical-align:middle}
.jb-ui .medal span{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px}
.jb-ui .medal i{font-style:normal;font-size:12px;color:var(--faint)}.jb-ui .medal i.on{color:var(--yl)}
.jb-ui .medal small{font-size:11.5px;color:var(--dim)}
.jb-ui .legs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;max-width:min(720px,92vw)}
.jb-ui .legs span{display:flex;gap:6px;align-items:baseline;font-size:12.5px}.jb-ui .legs small{font-family:var(--mono);font-size:9px;color:var(--cy)}.jb-ui .legs i{font-style:normal;color:var(--yl);font-size:11px}
.jb-ui .cmd2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.jb-ui .cmd2 .cmd{height:40px}.jb-ui .cmd2 .cmd b{font-size:15px}
.jb-ui .mod .school{grid-area:auto;grid-column:1/-1;margin-top:0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--cy)}
.jb-ui .mod .school.on{color:var(--yl);text-shadow:0 0 10px rgba(243,255,0,.5)}
.jb-ui .mod.route>span{grid-template-areas:"hx hx" "b b" "s s" "w w" "k k"}
.jb-ui .mod.route .wx{grid-area:w;font-size:11.5px;line-height:1.5;color:var(--dim)}
.jb-ui .mod.route .risk{grid-area:k;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--cy)}
.jb-ui .mod.route.r1 .risk{color:var(--yl)}.jb-ui .mod.route.r2 .risk{color:var(--rd)}
.jb-ui .chips{display:flex;flex-wrap:wrap;gap:6px}.jb-ui .chips.col1{flex-direction:column}
.jb-ui .chip{pointer-events:auto;appearance:none;border:1px solid var(--line);background:rgba(7,3,18,.62);font:inherit;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:13px;font-weight:700;letter-spacing:.08em;-webkit-tap-highlight-color:transparent;text-align:left}
.jb-ui .chip small{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--faint);letter-spacing:.06em}
.jb-ui .chip i{width:12px;height:12px;display:inline-block;box-shadow:0 0 8px currentColor}
.jb-ui .chip.on{border-color:var(--cy);background:rgba(0,240,255,.14);box-shadow:inset 0 0 12px rgba(0,240,255,.25)}
.jb-ui .chip.lock{opacity:.5}
.jb-ui .hint{max-width:min(460px,88vw);padding:8px 14px;border-left:2px solid var(--yl);background:rgba(243,255,0,.06);font-size:13.5px;line-height:1.55;color:var(--tx);text-align:left}
.jb-ui .hint small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--yl);margin-bottom:2px}
.jb-ui .wait{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--yl);border:1px dashed rgba(243,255,0,.5)}
/* the mission card */
.jb-ui .brief{display:flex;align-items:center;justify-content:center;text-align:center}
.jb-ui .frame i{position:absolute;width:30px;height:30px;border:0 solid var(--cy);opacity:.85}
.jb-ui .frame i:nth-child(1){top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));border-top-width:2px;border-left-width:2px}
.jb-ui .frame i:nth-child(2){top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));border-top-width:2px;border-right-width:2px}
.jb-ui .frame i:nth-child(3){bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));border-bottom-width:2px;border-left-width:2px}
.jb-ui .frame i:nth-child(4){bottom:max(14px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));border-bottom-width:2px;border-right-width:2px}
.jb-ui .bx{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 26px;background:linear-gradient(90deg,transparent,rgba(7,3,18,.55) 20%,rgba(7,3,18,.55) 80%,transparent)}
.jb-ui .big{font-weight:800;font-size:clamp(46px,min(13vh,14vw),112px);letter-spacing:.06em;line-height:1.05;transform:skewX(-10deg);color:#f4fbff}
.jb-ui .big.lat{font-family:var(--cond);font-weight:700;letter-spacing:.08em;transform:none}
.jb-ui .big.win{color:var(--yl)}.jb-ui .big.lose{color:var(--rd)}
.jb-ui .rule{max-width:min(620px,90vw);font-size:12.5px;line-height:1.5;color:var(--tx);text-align:center;padding:4px 10px;border-top:1px dashed rgba(243,255,0,.35)}
.jb-ui .rule b{font-weight:600;color:var(--yl);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.jb-ui .data{display:flex;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.jb-ui .data span{padding:3px 14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.jb-ui .data span+span{border-left:1px solid var(--line)}
.jb-ui .data small{font-size:9px;letter-spacing:.26em;color:var(--mg)}
.jb-ui .data i.c{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
/* results */
.jb-ui .res{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.jb-ui .stamp{display:flex;border:1px solid var(--yl);transform:rotate(-2deg);box-shadow:0 0 22px rgba(243,255,0,.25)}
.jb-ui .stamp span{padding:4px 12px;background:var(--yl);color:#0a0612;font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.16em}
.jb-ui .stamp b{padding:4px 12px;color:var(--yl);font-size:13px;letter-spacing:.3em;display:flex;align-items:center}
.jb-ui .h2{font-weight:800;font-size:clamp(30px,min(8.5vh,10vw),62px);letter-spacing:.08em;transform:skewX(-9deg);line-height:1.1}
.jb-ui .rd{display:flex;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(0,240,255,.07),transparent)}
.jb-ui .rd div{padding:6px 20px;display:flex;flex-direction:column;align-items:center;gap:2px}
.jb-ui .rd small{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--cy)}
.jb-ui .rd b{font-family:var(--cond);font-size:27px;font-weight:700;letter-spacing:.08em;line-height:1.05}
.jb-ui .mods{display:flex;gap:10px;width:min(100%,780px)}
.jb-ui .mod{pointer-events:auto;appearance:none;border:0;font:inherit;color:var(--tx);cursor:pointer;flex:1;display:flex;padding:1px;min-width:0;background:linear-gradient(160deg,var(--cy),rgba(0,240,255,.15) 50%,var(--mg));clip-path:${CUT(14)};transition:transform .15s,filter .15s;-webkit-tap-highlight-color:transparent}
.jb-ui .mod>span{flex:1;position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hx hx" "ico ico" "b b" "s s";justify-items:start;gap:7px 12px;padding:14px;text-align:left;background:linear-gradient(160deg,rgba(6,44,60,.96),rgba(8,4,20,.95) 45%);clip-path:${CUT(14, .5)}}
.jb-ui .mod .hx{grid-area:hx;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint)}
.jb-ui .mod .ico{grid-area:ico;width:36px;height:36px;display:grid;place-items:center;color:var(--cy);border:1px solid var(--cy);box-shadow:inset 0 0 14px rgba(0,240,255,.35)}
.jb-ui .mod .ico svg{width:18px;height:18px}
.jb-ui .mod b{grid-area:b;font-size:16px;font-weight:800;letter-spacing:.12em}
.jb-ui .mod small{grid-area:s;font-size:12px;color:var(--dim);line-height:1.5}
.jb-ui .mod em{position:absolute;right:12px;top:10px;font-family:var(--mono);font-style:normal;font-size:10px;font-weight:700;color:var(--yl)}
.jb-ui .mod:hover{filter:brightness(1.2)}
.jb-ui .mod.press{transform:scale(.97);filter:brightness(1.5)}
.jb-ui .ecg{width:min(280px,70vw);height:36px;overflow:visible}
.jb-ui .ecg path{fill:none;stroke:var(--rd);stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;animation:jEcg 2.2s ease-out .3s forwards;filter:drop-shadow(0 0 4px var(--rd))}
@keyframes jEcg{to{stroke-dashoffset:0}}
.jb-ui .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.jb-ui .row .k{min-width:170px}
.jb-ui .tbl{width:min(100%,430px);display:flex;flex-direction:column;gap:4px}
.jb-ui .tr{display:grid;grid-template-columns:28px auto 1fr 36px;gap:12px;align-items:center;height:34px;padding:0 12px;text-align:left;background:linear-gradient(90deg,rgba(0,240,255,.08),transparent);border-left:3px solid var(--c);font-size:14px;font-weight:700;letter-spacing:.1em}
.jb-ui .tr .p{font-family:var(--mono);font-size:11px;color:var(--faint)}
.jb-ui .tr .b{height:4px;background:rgba(255,255,255,.1)}.jb-ui .tr .b i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.jb-ui .tr .n{font-family:var(--cond);font-size:23px;text-align:right}
.jb-ui .tr.me{background:linear-gradient(90deg,rgba(243,255,0,.16),transparent)}
.jb-ui .corner{position:absolute;z-index:6;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))}
.jb-ui .hide-l{display:none}
@media (orientation:landscape){
 .jb-ui .title{grid-template-columns:minmax(0,1.08fr) minmax(290px,.92fr);grid-template-rows:auto 1fr auto;column-gap:28px}
 .jb-ui .strip,.jb-ui .ticker{grid-column:1/-1}
 .jb-ui .hero,.jb-ui .deck{align-self:center}
 .jb-ui .split{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px}
 .jb-ui .cmd{height:50px}
}
@media (orientation:portrait){
 .jb-ui .hide-p{display:none}.jb-ui .hide-l{display:inline}
 .jb-ui .mods{flex-direction:column}
 .jb-ui .mod>span{grid-template-areas:"ico b" "ico s";align-items:center}
 .jb-ui .mod .hx{display:none}
 .jb-ui .row{flex-direction:column;width:min(100%,300px)}
}

            <div class="log a" style="--i:1"><p style="--j:0">&gt; boot flight_core.sys <i>........</i> <b>[OK]</b></p><p style="--j:1">&gt; calibrate horizon <i>..........</i> <b>[OK]</b></p><p style="--j:2">&gt; ordnance cache LV.${pad(W.wl, 2)} <i>.......</i> <b>[OK]</b></p><p style="--j:3">&gt; pilot ${CALLS[SET.call][0]} // ${CALLS[SET.call][1]}-01 <i>....</i> <b>READY</b></p></div>
            ${IPHONE && !fsOK() && !standalone() ? '<div class="tip a" style="--i:2">// 全屏：分享 → 添加到主屏幕</div>' : ''}
            <div class="ttl a" style="--i:2"><div class="ghost">JUST<br>BREATHE</div><h1 class="h1 gl rgb" data-t="深呼吸">深呼吸</h1></div>
            <div class="sub a" style="--i:3"><span class="tag">EXE</span>just_breathe // 黄昏空战<span class="blink">▮</span>${MOBILE ? '<span class="hide-l">// 横屏更佳</span>' : ''}</div>
          </section>
          <section class="deck">
            ${baked ? `<nav class="a" style="--i:4;display:flex;flex-direction:column;gap:8px">
              ${k('start', 'cmd pri', `<em>01</em><b>起飞</b><small>SORTIE // LEG 01</small><span class="end">${I('chev')}</span>`)}
              ${G0.unlocked > 1 ? k('continue', 'cmd', `<em>02</em><b>继续</b><small>RESUME // LEG ${pad(G0.unlocked, 2)}</small><span class="end">${I('chev')}</span>`) : ''}
              ${k('net', 'cmd', `<em>${G0.unlocked > 1 ? '03' : '02'}</em><b>联机</b><small>NETLINK // CO-OP · PVP</small><span class="end">${I('net')}</span>`)}
              <div class="cmd2">${k('daily', 'cmd', `<b>每日挑战</b><small>DAILY</small>`)}${k('hangar', 'cmd', `<b>机库</b><small>HANGAR</small>`)}</div>
            </nav>
            ${G0.best ? `<div class="hi a" style="--i:5"><small>HI-SCORE</small><b>${zeros(G0.best, 7)}</b></div>` : ''}
            <div class="sws a" style="--i:6">${sw('set-cam', 'CAM 镜头', ['平稳', '动感'], SET.cam)}${sw('set-ctl', 'CTRL 操作', ['街机', '飞行员'], SET.pilot)}${sw('set-fire', 'FIRE 开火', ['按住', '自动'], SET.auto)}${sw('set-assist', 'ASSIST 失败后变简单', ['关', '开'], SET.assist)}</div>`
            : `<div class="boot a" style="--i:4"><div class="lbl">RENDERING SKYBOX <b data-prog>00%</b></div><div class="pbar">${'<i></i>'.repeat(20)}</div><div class="note">// 正在绘制天空与海面的全景，只需一次</div></div>`}

    },
    lobby() {
      const ads = NET.kind ? NET.lobby.peers().filter(q => !q.me && q.st.ad && /^\d{4}$/.test(q.st.ad.c)).map(q => q.st.ad).slice(0, 6) : [];

      const rows = ads.map(a => {
        const n = clamp(a.n | 0, 1, 4), full = n >= 4;
        return `<button class="chan" data-act="${full ? 'noop' : 'join:' + a.c}"><span class="code">CH-${a.c}</span><span class="md${a.vs ? ' vs' : ''}">${a.vs ? 'PVP' : 'CO-OP'}</span><span class="lv">${a.vs ? 'FT' + VS_GOAL : 'LV.' + pad(clamp(a.lv | 0, 1, 99), 2)}</span><span class="slots">${[0, 1, 2, 3].map(q => `<i${q < n ? ' class="on"' : ''}></i>`).join('')}</span><span class="go">${full ? 'FULL' : 'JOIN ›'}</span></button>`;
      }).join('');
      return {
        scene: 'l', key: [NET.status, NET.kind, ads.map(a => [a.c, a.n, a.lv, a.vs].join(':')).join('|')].join(),

          </div></div></div>`,
      };
    },
    room() {
      const crew = [{ slot: MP.slot, me: true, host: MP.host }, ...mateList().map(m => ({ slot: m.slot, me: false, host: m.peer === MP.hostId }))];
      const slots = [0, 1, 2, 3].map(s => { const q = crew.find(x => x.slot === s); return q ? `<div class="slot" style="--c:${MCSS[s]}"><span class="no">0${s + 1}</span><b>${CALL[s]}</b><small>${CALL_EN[s]}</small><em class="st">${q.host ? 'HOST' : q.me ? 'YOU' : 'READY'}</em></div>` : `<div class="slot empty"><span class="no">0${s + 1}</span><b>— 空位 —</b><small>AWAITING LINK<span class="blink">_</span></small></div>`; }).join('');
      const tabs = MP.host ? `<div class="tabs"><button class="${MP.vs ? '' : 'on'}"${MP.vs ? ' data-act="vsmode"' : ''}>合作<small>CO-OP</small></button><button class="${MP.vs ? 'on vs' : ''}"${MP.vs ? '' : ' data-act="vsmode"'}>对战<small>PVP</small></button></div>` : `<span class="md${MP.vs ? ' vs' : ''}">${MP.vs ? 'PVP · 对战' : 'CO-OP · 合作'}</span>`;
      const cta = !MP.host ? '<div class="wait">AWAITING HOST<span class="blink">_</span>&nbsp; 等待房主起飞</div>' : MP.vs ? k('start', 'pri wide', `开战<small>ENGAGE // FT${VS_GOAL}</small><span style="margin-left:auto">${I('chev')}</span>`) : k('start', 'pri wide', `起飞<small>SORTIE // LV.01</small><span style="margin-left:auto">${I('chev')}</span>`) + (G0.unlocked > 1 ? k('continue', 'wide', `继续<small>RESUME // LV.${pad(G0.unlocked, 2)}</small>`) : '');
      return {
        scene: 'r', key: [MP.code, MP.host, MP.vs, MP.teams, G0.unlocked, crew.map(q => q.slot + (q.me ? 'm' : '') + (q.host ? 'h' : '')).sort().join()].join(),
        html: E => `<div class="scr net${E}"><div class="vig solid"></div>
          <header class="bar a" style="--i:0">${k('leave', 'sm', `${I('back')}离开`)}<div class="h"><small>// 机库 · SQUAD BAY</small><b class="gl rgb" data-t="CH-${MP.code}">CH-${MP.code}</b></div><span class="sp"></span>${tabs}</header>
          <div class="split a" style="--i:1"><div class="col">
            <div class="lbl">SQUAD <b>[${crew.length}/4]</b></div>
            <div class="squad">${slots}</div>
          </div><div class="col">
            <div class="mdesc"><b>${MP.vs ? (MP.teams ? 'PVP // 2V2' : 'PVP // 对战') : 'CO-OP // 合作'}</b>${MP.vs ? (MP.teams ? `1、3 号位对 2、4 号位，队友之间不会误伤，按队伍计分，先到 ${VS_GOAL} 架获胜。` : `没有敌机，互相击落。先到 ${VS_GOAL} 架获胜。`) + '被击落 3 秒后重返；武器从 Lv.8 起步，击落就升级；补给箱有弹药、修理、护盾和火箭。' : '一起对付敌机，最多四人。敌机随人数变得更耐打；落水的人会打出信号弹，队友低空飞过就能救起。'}</div>
            ${MP.vs && MP.host ? `<div class="tabs" style="align-self:flex-start"><button class="${MP.teams ? '' : 'on vs'}"${MP.teams ? ' data-act="teams"' : ''}>个人<small>FFA</small></button><button class="${MP.teams ? 'on vs' : ''}"${MP.teams ? '' : ' data-act="teams"'}>2v2<small>TEAMS</small></button></div>` : ''}

    brief() {
      const name = G0.vs ? `先击落 ${VS_GOAL} 架` : String(G0.levelName);
      return {
        scene: 'b' + G0.level + G0.vs + ENV.id, key: [G0.level, G0.levelName, G0.vs, W.wl, ENV.id, G0.ms && G0.ms.type].join(),
        html: E => `<div class="scr brief${E}"><div class="frame"><i></i><i></i><i></i><i></i></div>
          <div class="bx a" style="--i:0">
            <div class="mono" style="font-size:11px;letter-spacing:.32em;color:var(--cy)">${G0.vs ? 'PVP // FREE-FOR-ALL' : 'LEG ' + pad(G0.level, 2) + '/' + pad(STAGES, 2) + (G0.loop > 1 ? ' · ROUND ' + G0.loop : '') + ' // 第 ' + G0.level + ' 段'} <span class="blink">▮</span></div>
            <div class="big rgb" data-scr="${esc(name)}">${esc(name)}</div>
            <div class="data">${G0.vs ? `<span><small>RULE</small>击落就升级</span>` : `<span><small>OBJECTIVE // ${G0.ms ? MISSION_EN[G0.ms.type] : ''}</small>${G0.ms ? MISSION_GOAL[G0.ms.type] : ''}</span>`}<span><small>WEATHER</small>${ENV.name} · ${ENV.en}</span><span><small>ORDNANCE</small><span style="flex-direction:row;padding:0;border:0"><i class="c" style="--c:${rgbOf(tierOf(W).col)}"></i>LV.${pad(W.wl, 2)} ${esc(tierOf(W).name)}</span></span></div>
            ${G0.vs ? '' : `<div class="rule">${esc(ENV_RULE[ENV.id] || '')}${G0.help ? ` <b>// 辅助 LV.${G0.help}：敌机开火更慢</b>` : ''}</div>`}

      }).join('');
      return {
        scene: 'c' + G0.level, key: [G0.level, G0.cards.map(c => c.name).join(), G0.score, MP.on, G0.medal && G0.medal.n].join(),
        html: E => `<div class="scr res${E}"><div class="vig solid"></div>
          <div class="stamp a" style="--i:0"><span>MISSION COMPLETE</span><b>任务完成</b></div>
          <div class="h2 gl rgb a" style="--i:1" data-t="${esc(G0.levelName)}">${esc(G0.levelName)}</div>
          <div class="rd a" style="--i:2">${MP.on && !MP.host ? '' : `<div><small>BONUS</small><b>+${G0.clearBonus || 0}</b></div>`}<div><small>SCORE</small><b>${zeros(G0.score, 7)}</b></div><div><small>ORDNANCE</small><b>LV.${pad(W.wl, 2)}</b></div></div>
          ${medalHtml()}
          ${nextUnlock() ? `<div class="mono a" style="--i:2;font-size:11px;letter-spacing:.1em;color:var(--dim)">NEXT // ${esc(nextUnlock())}</div>` : ''}

        html: E => `<div class="scr res${E}"><div class="vig red"></div>
          ${MP.on ? `<div class="corner">${k('leave', 'sm', `${I('back')}离开房间`)}</div>` : ''}
          <div class="lbl c a" style="--i:0;color:var(--rd)">!! SIGNAL LOST // 信号中断 !!</div>

          ${host ? `<div class="row a" style="--i:3">${k('retry', 'pri', `再试第 ${G0.level} 段<small>RETRY</small>`)}${G0.daily ? k('daily', '', `重开每日挑战<small>RESTART</small>`) : k('start', '', `从第 1 段开始<small>REBOOT</small>`)}${MP.on ? k('toroom', '', `回到房间<small>BAY</small>`) : ''}</div>` : '<div class="wait a" style="--i:3">AWAITING HOST // 等待房主<span class="blink">_</span></div>'}
        </div>`,
      };
    },
    done() {                                                           // the campaign is over: what you did, and whether to go round again

        html: E => `<div class="scr res${E}"><div class="vig solid"></div>
          ${MP.on ? `<div class="corner">${k('leave', 'sm', `${I('back')}离开房间`)}</div>` : ''}

          ${G0.restNow ? '<div class="hint a" style="--i:3"><small>BREAK // 休息</small>已经飞了半个小时。深呼吸，休息一下。</div>' : ''}
          ${host ? `<div class="row a" style="--i:4">${k('ngplus', 'pri', `新一轮<small>ROUND ${G0.loop + 1} · 难度 +30%</small>`)}${MP.on ? k('toroom', '', `回到房间<small>BAY</small>`) : k('back', '', `回到标题<small>TITLE</small>`)}</div>` : '<div class="wait a" style="--i:4">AWAITING HOST // 等待房主<span class="blink">_</span></div>'}
        </div>`,
      };
    },
    route() {                                                          // three ways on: mission, sky, risk, reward
      const rs = G0.routes || [];

        scene: 'rt' + G0.level, key: rs.map(r => r.type + r.env).join(),

        </div>`,

      const stars = totalStars();

        scene: 'hg', key: [SET.livery, SET.call, SET.startCard, stars].join(),

          <header class="bar a" style="--i:0">${k('back', 'ico', I('back'))}<div class="h"><small>// 机库 · HANGAR</small><b class="gl rgb" data-t="${CALLS[SET.call][1]}-01">${CALLS[SET.call][1]}-01</b></div><span class="sp"></span><span class="mono" style="font-size:12px;color:var(--yl)">★ ${stars}</span></header>
          <div class="split a" style="--i:1"><div class="col">
            <div class="lbl">LIVERY // 涂装</div>

      }, 'FIRE');

        const b = fireBtn(), x = (b.x - r.left) * u, y = (b.y - r.top) * u, R1 = (b.r * 1.05 + 7) * u, rk = 1 - G0.rollCD / ROLL_CD;
        c.lineWidth = 2 * u; c.strokeStyle = rk >= 1 ? ac(input.firePtr !== null ? .6 : .3) : ac(input.firePtr !== null ? .3 : .12); c.beginPath(); c.arc(x, y, R1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rk); c.stroke();
        if (rk >= 1) text('⇆ ROLL', x, y - R1 - 8 * u, F(700, 8, MONO), ac(.6), 'center', 2);
      }
      {                                                                // 专注: a circle that fills, bright from half
        const b = focusBtn(), x = (b.x - r.left) * u, y = (b.y - r.top) * u, R1 = b.r * u, fk = G0.focus / 100, ok = G0.focus >= 50;
        c.beginPath(); c.arc(x, y, R1, 0, Math.PI * 2); c.fillStyle = G0.focusOn ? ac(.3) : ink(.25); c.fill();

      }
      key(boostBtn(), input.boostPtr !== null, AC, ac, (x, y, R1) => {
        const s = R1 * .3; c.beginPath();
        for (const o of [-.55, .55]) { c.moveTo(x + (o - .5) * s, y - s * .9); c.lineTo(x + (o + .5) * s, y); c.lineTo(x + (o - .5) * s, y + s * .9); }

    }
  }

  // ── the loop ──
  let last = 0, frameNo = 0;
  const loop = now => {
    requestAnimationFrame(loop);
    const [ow, oh] = sizeCanvas(glv, stage, 1600);
    readInsets();
    if (!R.baked) { R.bakeStep(); if (!R.ready) { drawHUD(); last = now; return; } }   // a new sky bakes under the live picture
    let dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    if (G0.stop > 0) { G0.stop -= dt; dt *= .12; }                     // hit-stop: the world holds its breath on a kill
    if (!paused) { update(dt); updateCamera(dt); snd.tick(); }
    const sc = dyn.tick(now);
    const sc0 = G0.mode === 'replay' && G0.replay ? replayScene() : scene(frameNo++);
    if (G0.mode === 'fly' && !MP.on && frameNo % 2 === 0) { G0.rec.push({ s: sc0, rt: G0.rt || 0 }); while (G0.rec.length && G0.rt - G0.rec[0].rt > 5) G0.rec.shift(); }
    R.frame({ ...sc0, flash: FLASH, fast: true, sceneW: Math.max(64, Math.round(ow * sc)), sceneH: Math.max(36, Math.round(oh * sc)), outW: ow, outH: oh, cloudScale: .4, steps: MOBILE ? 52 : 68 });
    drawHUD();
  };
  requestAnimationFrame(loop);
  window.GAME = { makeRoutes, startDaily, dailyPlan, syn, get PERKS() { return PERKS; }, stageDef, missionStart, get allies() { return allies; }, get missiles() { return missiles; }, roll, focusToggle, tipFor, damage, setEnv, get envIdx() { return envIdx; }, snd, startMatch, MP, NET, get mates() { return mateList(); }, hostRoom, joinRoom, leaveRoom, G: G0, update, updateCamera, SET, get cam() { return cam; }, get W() { return W; }, get player() { return player; }, get enemies() { return enemies; }, get pickups() { return pickups; }, input, newRun, startLevel, spawnWave, levelClear, press };
}

// ───────────────────────── live: the film (or, with ?play, the game) ─────────────────────────
// The WebGL canvas is shown directly and rendered at a dynamic resolution; the 2D canvas becomes a
// transparent overlay for the words and the fades. Sky and reflections are baked once, then the fast path runs.
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;
function makeStage() {
  const st = document.createElement('style');
  st.textContent = `#stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; }
    .jb-btn { position: absolute; font: italic 17px "Iowan Old Style", Palatino, Georgia, serif; color: #fff4e2; background: rgba(40, 20, 50, .35);
      border: 1px solid rgba(255, 244, 226, .45); border-radius: 999px; padding: 8px 18px; letter-spacing: .06em; cursor: pointer; -webkit-tap-highlight-color: transparent; }`;
  document.head.appendChild(st);
  const stage = document.createElement('div'); stage.id = 'stage';
  const glv = document.createElement('canvas');
  document.body.appendChild(stage); stage.append(glv, canvas);
  return { stage, glv };
}
function sizeCanvas(glv, stage, cap = 1600) {
  const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  const k = Math.min(1, cap / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  if (glv.width !== w || glv.height !== h) { glv.width = w; glv.height = h; }
  return [w, h];
}
function bootFilm() {
  const { stage, glv } = makeStage();
  const R = createRenderer(glv, { fast: true });
  if (!R) { stage.textContent = 'This film needs WebGL2.'; return; }
  R.bakeStart([-150, 100, 150], MOBILE);
  const dyn = makeDynRes(MOBILE ? .55 : .8, .3, 1);
  let start = 0, audio = null;
  const play = document.createElement('button'); play.className = 'jb-btn'; play.textContent = '起飞 ›';
  play.style.cssText = 'right: 14px; bottom: 14px;'; stage.appendChild(play);
  play.addEventListener('click', e => { e.stopPropagation(); location.search = '?play'; });
  stage.addEventListener('click', () => {
    if (audio) { audio.close(); audio = null; return; }
    audio = new AudioContext(); start = performance.now(); buildScore(audio);
  });
  const loop = now => {
    requestAnimationFrame(loop);
    const [ow, oh] = sizeCanvas(glv, stage);
    if (!R.baked) { R.bakeStep(); ctx.fillStyle = '#08060e'; ctx.fillRect(0, 0, W, H); start = now; return; }
    const f = Math.floor((now - start) / 1000 * FPS) % FRAMES, sc = dyn.tick(now);
    const { S, t, cam, hf } = filmScene(f);
    R.frame({ ...S, fast: true, sceneW: Math.round(ow * sc), sceneH: Math.round(oh * sc), outW: ow, outH: oh, cloudScale: .4, steps: MOBILE ? 56 : 72 });
    ctx.clearRect(0, 0, W, H);
    overlay(ctx, t, cam, hf);
  };
  requestAnimationFrame(loop);
}
if (!q.has('render')) (q.has('play') ? bootGame : bootFilm)();
