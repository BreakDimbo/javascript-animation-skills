<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sound Visualize Replica v1.2</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a1630; color: #e8eef8; font-family: system-ui, sans-serif;
    }
    main { width: min(1280px, 100vw); padding: 16px; box-sizing: border-box; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }
    video { width: 100%; height: auto; background: #000; border-radius: 8px; display: block; }
    p { margin: 10px 0 0; opacity: 0.7; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sound Visualize Replica · v1.2</h1>
    <video controls playsinline preload="metadata" src="./replica_v1_2_web.mp4"></video>
    <p>静帧路线最终版 · 网页兼容 H.264</p>
  </main>
</body>
</html>
